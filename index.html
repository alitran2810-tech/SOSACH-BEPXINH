<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sổ sách kế toán kho</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --fg: #0f172a;
      --mut: #64748b;
      --line: #e2e8f0;
      --hd: #1e293b;
      --hf: #ffffff;
      --ac: #1d4ed8;
      --ok: #dcfce7;
      --ok-fg: #166534;
      --er: #fee2e2;
      --er-fg: #991b1b;
      --warn: #fef3c7;
      --warn-fg: #92400e;
      --card: #f1f5f9;
      --sel: #eff6ff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) {
        --bg: #020617;
        --surface: #0f172a;
        --fg: #f1f5f9;
        --mut: #94a3b8;
        --line: #1e293b;
        --hd: #1e293b;
        --hf: #f8fafc;
        --ac: #3b82f6;
        --ok: #14532d;
        --ok-fg: #bbf7d0;
        --er: #7f1d1d;
        --er-fg: #fecaca;
        --warn: #78350f;
        --warn-fg: #fde68a;
        --card: #1e293b;
        --sel: #172554;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    header {
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .hdr-l, .hdr-r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    h1 { font-size: 16px; margin: 0 8px 0 0; color: var(--ac); font-weight: 700; white-space: nowrap; }
    button, select, input {
      font: inherit;
      color: var(--fg);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 9px;
    }
    button {
      cursor: pointer;
      background: var(--ac);
      color: #fff;
      border-color: var(--ac);
      font-weight: 600;
      white-space: nowrap;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.s { background: var(--surface); color: var(--fg); border-color: var(--line); font-weight: 500; }
    button.d { background: #dc2626; border-color: #dc2626; color: #fff; }
    input[type=number] { width: 68px; }
    nav {
      display: flex;
      gap: 4px;
      padding: 6px 14px 0;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      flex-shrink: 0;
    }
    nav button {
      background: transparent;
      color: var(--mut);
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      padding: 7px 12px;
      font-weight: 600;
    }
    nav button.on { color: var(--ac); border-bottom-color: var(--ac); }
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      gap: 8px;
    }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
    .w {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    table { border-collapse: collapse; width: 100%; white-space: nowrap; font-size: 12px; }
    thead { position: sticky; top: 0; z-index: 2; }
    tfoot { position: sticky; bottom: 0; z-index: 2; }
    th {
      background: var(--hd);
      color: var(--hf);
      padding: 7px 8px;
      font-weight: 600;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }
    th.n { text-align: right; }
    td { padding: 5px 8px; border-top: 1px solid var(--line); }
    td.n { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    tr:hover td { background: rgba(148, 163, 184, 0.08); }
    tr.sel td { background: var(--sel) !important; }
    tr.er td { background: var(--er); color: var(--er-fg); }
    tr.tt td, tfoot td { font-weight: 700; background: var(--card); color: var(--fg); }
    tfoot td { border-top: 1px solid var(--line); }
    .m { color: var(--mut); font-size: 12px; }
    .st {
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--ok);
      color: var(--ok-fg);
      font-size: 12px;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .st.er { background: var(--er); color: var(--er-fg); }
    .st.wn { background: var(--warn); color: var(--warn-fg); }
    .fm { display: grid; grid-template-columns: 210px minmax(0, 440px); gap: 8px; align-items: center; }
    .sg { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-top: 16px; gap: 12px; }
    .sc-wrap { flex: 1; min-height: 0; overflow: auto; }
    .sc {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px 22px;
      margin-bottom: 14px;
    }
    .sc table { white-space: normal; }
    .sc th, .sc td { border: 1px solid var(--line); padding: 4px 6px; }
    .sc th { text-align: center; }
    .pvs, .co { display: none; }
    body.pv .w, body.pv .bar, body.pv .st, body.pv h3 { display: none !important; }
    body.pv .pvs { display: block; }
    .pvs table { white-space: normal; }
    .pvs th, .pvs td { border: 1px solid #cbd5e1; }
    .modal-bg {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(15, 23, 42, 0.55);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal {
      width: 100%; max-width: 500px;
      background: var(--surface); color: var(--fg);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 20px; box-shadow: 0 20px 35px rgba(0, 0, 0, 0.25);
    }
    .modal h3 { margin: 0 0 8px; font-size: 15px; }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    @media print {
      html, body { height: auto !important; overflow: visible !important; background: #fff !important; color: #000 !important; }
      header, nav, .bar, .noprint, .st, .modal-bg { display: none !important; }
      main { padding: 0 !important; display: block !important; }
      .w, .sc-wrap { overflow: visible !important; max-height: none !important; border: 0 !important; }
      .sc { border: 0 !important; padding: 0 !important; margin: 0 !important; }
      thead, tfoot { position: static !important; }
      th { background: #e2e8f0 !important; color: #000 !important; border: 1px solid #94a3b8 !important; }
      td { border: 1px solid #cbd5e1 !important; color: #000 !important; }
      .co { display: block; margin-bottom: 6px; }
      .pb { page-break-after: always; break-after: page; }
    }
  </style>
</head>
<body>
  <header>
    <div class="hdr-l">
      <h1>SỔ SÁCH KẾ TOÁN KHO</h1>
      <label>Năm <input id="yr" type="number" value="2026" style="width:78px"></label>
      <label>Tính giá đến tháng <input id="up" type="number" min="0" max="12" value="12"></label>
    </div>
    <div class="hdr-r">
      <button class="s" id="bsample" style="display:none">Nạp dữ liệu mẫu</button>
      <button class="s" id="bexp">⬇ Sao lưu JSON</button>
      <label style="display:inline-block">
        <input id="fimp" type="file" accept=".json" style="display:none">
        <button class="s" type="button" onclick="this.previousElementSibling.click()">⬆ Khôi phục JSON</button>
      </label>
      <button class="s" id="bclear">🗑 Xóa dữ liệu</button>
      <span id="sy" class="m"></span>
    </div>
  </header>
  <nav id="nv"></nav>
  <main id="mn"></main>
  <div id="mdl"></div>

  <script>
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = (v, d = 0) => v === "" || v == null || isNaN(v) ? "" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
    const dr = s => s ? s.split("-").reverse().join("/") : "";

    const STORE_KEY = "so_ke_toan_kho_html_v1";
    const P = [], Ln = [], NKX = [], KH = [], NCC = [];
    const CFG = { ten: "", dc: "", mst: "", tk: "156", kho: "Kho chính", ghi: "", kt: "", dd: "" };

    let scMa = "", scAll = false, tab = "tk";
    let kt = { t: "Tháng", k: 1 };
    let s10 = { t: "Tháng", k: 1 };
    let ctPer = { t: "Tất cả", k: 1, y: 2026 };
    let ctQ = "";
    let msg = "", merr = 0;

    const TABS = [
      ["nk", "Nhật ký chung"],
      ["ct", "Chi tiết xuất nhập"],
      ["tk", "Tổng hợp tồn kho"],
      ["dm", "Danh mục hàng hóa"],
      ["kh", "Danh mục khách hàng"],
      ["ncc", "Danh mục nhà cung cấp"],
      ["cf", "Thông tin doanh nghiệp"]
    ];

    function saveLocal() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          yr: +$("#yr").value || 2026,
          up: +$("#up").value || 0,
          P, Ln, NKX, KH, NCC, CFG
        }));
        $("#sy").textContent = "Đã tự lưu trên trình duyệt";
      } catch (e) {}
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return;
        const d = JSON.parse(raw);
        if (d.yr) $("#yr").value = d.yr;
        if (d.up != null) $("#up").value = d.up;
        if (Array.isArray(d.P)) P.push(...d.P);
        if (Array.isArray(d.Ln)) Ln.push(...d.Ln);
        if (Array.isArray(d.NKX)) NKX.push(...d.NKX);
        if (Array.isArray(d.KH)) KH.push(...d.KH);
        if (Array.isArray(d.NCC)) NCC.push(...d.NCC);
        if (d.CFG) Object.assign(CFG, d.CFG);
        ctPer.y = +$("#yr").value || 2026;
      } catch (e) {}
    }

    const st = (t, e = 0) => { msg = t; merr = e; };
    const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d").toLowerCase().replace(/[^a-z0-9]/g, "");

    const mk = {
      dm: {
        ma: ["mahang", "ma"],
        ten: ["tenhang", "tenhanghoa", "ten"],
        dvt: ["dvt", "donvitinh"],
        sl: ["slton", "tondausl", "tondaunamsoluong", "tondaunamsl", "tonkhodaukysoluong", "tondaukysoluong", "soluong", "sl"],
        gt: ["gtton", "tondaugt", "tondaunamgiatri", "tondaunamgt", "tonkhodaukygiatri", "tondaukygiatri", "giatri", "gt"],
        dg: ["tonkhodaukydongia", "tondaukydongia"]
      },
      ct: {
        ph: ["maphieu"], ngay: ["ngay"], hd: ["sohoadon", "sohd"],
        kh: ["makhmancc", "makh", "mancc", "makhachhang"],
        no: ["tkno", "no"], co: ["tkco", "co"], nd: ["noidung", "noidungphieu"],
        ma: ["mahang"], sn: ["nhapsoluong", "slnhap", "nhapsl"],
        gn: ["nhapdongia", "dgnhap", "dongianhap"],
        sx: ["xuatsoluong", "slxuat", "xuatsl"],
        gi: ["gandongiaxuat", "gangiaxuat", "giaxuat", "xuatdongia", "dgxuat"]
      },
      nk: {
        ph: ["maphieu"], ngay: ["ngay"], hd: ["sohoadon", "sohd"], nd: ["noidung"],
        no: ["tkno", "taikhoanno"], co: ["tkco", "taikhoanco"],
        tien: ["sotien", "giatri"], kh: ["makhmancc", "makh", "mancc"]
      },
      kh: {
        ma: ["makh", "ma", "makhachhang"],
        ten: ["thongtinkhachhang", "thongtin", "tenkhachhang", "ten"],
        mst: ["mst", "masothue"],
        dau: ["dauky", "sodudauky", "dudauky"]
      },
      ncc: {
        ma: ["mancc", "ma", "manhacungcap"],
        ten: ["thongtinnhacungcap", "thongtinkhachhang", "thongtin", "tennhacungcap", "ten"],
        mst: ["mst", "masothue"],
        dau: ["dauky", "sodudauky", "dudauky"]
      }
    };

    function toDate(v) {
      if (v instanceof Date && !isNaN(v.getTime())) return new Date(v.getTime() - v.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
      if (typeof v === "number") return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
      const m = String(v || "").trim().match(/^(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{4})$/);
      if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
      return String(v || "").slice(0, 10);
    }

    function mqyInfo(ngay) {
      if (!ngay || ngay.length < 7) return null;
      const y = +ngay.slice(0, 4), m = +ngay.slice(5, 7);
      if (!y || !m || m < 1 || m > 12) return null;
      const q = Math.ceil(m / 3);
      return { y, m, q, lbl: `T${String(m).padStart(2, "0")} · Q${q}/${y}` };
    }

    function showDuplicateModal(incoming, overlapKeys, rowCount, cols) {
      const labels = overlapKeys.map(ym => {
        const [y, m] = ym.split("-");
        return `Tháng ${m}/${y} (Quý ${Math.ceil(+m / 3)})`;
      });
      const overlapSet = new Set(overlapKeys);
      const hasOther = Ln.some(l => l.ngay && l.ngay.length >= 7 && !overlapSet.has(l.ngay.slice(0, 7)));

      $("#mdl").innerHTML = `
        <div class="modal-bg">
          <div class="modal">
            <h3>Xác nhận import dữ liệu trùng kỳ</h3>
            <p style="margin:6px 0 10px"><b>Kỳ xuất nhập kho này đã có dữ liệu. Bạn muốn import thêm vào dữ liệu đã có sẵn hay import đè xóa hoàn toàn dữ liệu cũ?</b></p>
            <div class="st wn" style="display:block">Kỳ trùng: ${esc(labels.join(", "))} (Hiện có ${Ln.length} dòng · File mới ${incoming.length} dòng)</div>
            <div class="modal-actions">
              <button class="s" id="m-cancel">Hủy</button>
              ${hasOther ? `<button class="s" id="m-rep">Chỉ ghi đè kỳ trùng</button>` : ""}
              <button class="d" id="m-over">Ghi đè (Xóa dữ liệu cũ)</button>
              <button id="m-app">Ghi thêm</button>
            </div>
          </div>
        </div>`;

      const close = () => { $("#mdl").innerHTML = ""; };
      $("#m-cancel").onclick = close;
      $("#m-app").onclick = () => {
        Ln.push(...incoming);
        if (Ln[0] && Ln[0].ngay) $("#yr").value = Ln[0].ngay.slice(0, 4);
        st(`Đã ghi thêm ${incoming.length} dòng vào dữ liệu sẵn có. Cột: ${cols}`);
        close(); saveLocal(); render();
      };
      $("#m-over").onclick = () => {
        Ln.length = 0; Ln.push(...incoming);
        if (Ln[0] && Ln[0].ngay) $("#yr").value = Ln[0].ngay.slice(0, 4);
        st(`Đã ghi đè (xóa dữ liệu cũ), giữ ${incoming.length} dòng mới. Cột: ${cols}`);
        close(); saveLocal(); render();
      };
      if (hasOther) {
        $("#m-rep").onclick = () => {
          const kept = Ln.filter(l => !l.ngay || l.ngay.length < 7 || !overlapSet.has(l.ngay.slice(0, 7)));
          Ln.length = 0; Ln.push(...kept, ...incoming);
          st(`Đã thay thế riêng kỳ trùng bằng ${incoming.length} dòng mới. Cột: ${cols}`);
          close(); saveLocal(); render();
        };
      }
    }

    function importFile(f, kind) {
      const r = new FileReader();
      r.onload = e => {
        try {
          const wb = XLSX.read(e.target.result, { type: "array", cellDates: true });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          const spec = mk[kind === "tk" ? "dm" : kind];
          const map = {};
          if (rows.length) {
            Object.keys(rows[0]).forEach(h => {
              const n = norm(h);
              for (const k in spec) if (spec[k].includes(n) && !(k in map)) map[k] = h;
            });
          }
          const g = (r, k) => map[k] ? r[map[k]] : "";
          const num = v => v === "" ? null : Number(String(v).replace(/,/g, ""));
          const cols = Object.keys(map).join(", ") || "không có - kiểm tra tiêu đề cột";

          if (kind === "dm" || kind === "tk") {
            P.length = 0;
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim();
              if (ma) P.push({
                ma, ten: String(g(r, "ten") ?? ""), dvt: String(g(r, "dvt") ?? ""),
                sl: num(g(r, "sl")) || 0,
                gt: num(g(r, "gt")) ?? (num(g(r, "sl")) || 0) * (num(g(r, "dg")) || 0)
              });
            });
          } else if (kind === "nk") {
            NKX.length = 0;
            rows.forEach(r => {
              const ph = String(g(r, "ph")).trim(), t = num(g(r, "tien"));
              if (ph || t) NKX.push({
                ngay: toDate(g(r, "ngay")), ph, hd: String(g(r, "hd")),
                nd: String(g(r, "nd")), no: String(g(r, "no")), co: String(g(r, "co")),
                tien: t || 0, kh: String(g(r, "kh"))
              });
            });
          } else if (kind === "kh" || kind === "ncc") {
            const A = kind === "kh" ? KH : NCC;
            A.length = 0;
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim();
              if (ma) A.push({ ma, ten: String(g(r, "ten")), mst: String(g(r, "mst")), dau: num(g(r, "dau")) || 0 });
            });
          } else {
            const incoming = [];
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim(), ph = String(g(r, "ph")).trim();
              if (ma || ph) incoming.push({
                ph, ngay: toDate(g(r, "ngay")), hd: String(g(r, "hd")), kh: String(g(r, "kh")),
                no: String(g(r, "no")), co: String(g(r, "co")), nd: String(g(r, "nd")),
                ma, sn: num(g(r, "sn")), gn: num(g(r, "gn")), sx: num(g(r, "sx")), gi: num(g(r, "gi"))
              });
            });
            if (Ln.length > 0) {
              const existSet = new Set(Ln.map(l => l.ngay ? l.ngay.slice(0, 7) : "").filter(Boolean));
              const overlap = [...new Set(incoming.map(l => l.ngay ? l.ngay.slice(0, 7) : "").filter(ym => ym && existSet.has(ym)))].sort();
              if (overlap.length > 0) {
                showDuplicateModal(incoming, overlap, rows.length, cols);
                return;
              }
              Ln.push(...incoming);
              if (incoming[0] && incoming[0].ngay) { $("#yr").value = incoming[0].ngay.slice(0, 4); ctPer.y = +$("#yr").value; }
              st(`Đã ghi thêm ${incoming.length} dòng kỳ mới. Cột nhận diện: ${cols}`);
              saveLocal(); render(); return;
            }
            Ln.length = 0; Ln.push(...incoming);
            if (Ln[0] && Ln[0].ngay) { $("#yr").value = Ln[0].ngay.slice(0, 4); ctPer.y = +$("#yr").value; }
          }
          st(`Đã đọc ${rows.length} dòng. Cột nhận diện: ${cols}`);
          saveLocal(); render();
        } catch (x) {
          st("Lỗi đọc file: " + x.message, 1); render();
        }
      };
      r.readAsArrayBuffer(f);
    }

    function calc() {
      const Y = +$("#yr").value, U = +$("#up").value;
      const pm = {}; P.forEach(p => pm[p.ma] = p);
      const M = {}; P.forEach(p => M[p.ma] = {});
      const first = {}, errs = new Map();
      Ln.forEach(l => {
        l._m = l.ngay && +l.ngay.slice(0, 4) === Y ? +l.ngay.slice(5, 7) : 0;
        l.gtn = l.sn != null ? Math.round(l.sn * (l.gn || 0)) : null;
        l.px = null;
        let e = "";
        if (!l.ph) e = "Thiếu mã phiếu";
        else if (!l.ngay) e = "Thiếu ngày";
        else if (first[l.ph] && first[l.ph].ngay !== l.ngay) e = `Mã phiếu bị trùng, đã có ở ngày ${dr(first[l.ph].ngay)} - vui lòng kiểm tra lại`;
        else if (!pm[l.ma]) e = "Mã hàng chưa có trong danh mục";
        if (l.ph && !first[l.ph]) first[l.ph] = l;
        if (e) errs.set(l, e);
      });
      P.forEach(p => {
        let s = p.sl, g = p.gt;
        for (let m = 1; m <= U; m++) {
          const ls = Ln.filter(l => l.ma === p.ma && l._m === m);
          let nS = 0, nG = 0, xS = 0, xI = 0, xIS = 0;
          ls.forEach(l => {
            nS += l.sn || 0; nG += l.gtn || 0; xS += l.sx || 0;
            if (l.sx && l.gi != null && l.gi !== "") { xI += l.sx * l.gi; xIS += l.sx; }
          });
          const pr = s + nS ? (g + nG) / (s + nS) : 0;
          const xG = (xS - xIS) * pr + xI;
          ls.forEach(l => { if (l.sx) l.px = l.gi != null && l.gi !== "" ? l.gi : pr; });
          M[p.ma][m] = { dS: s, dG: g, nS, nG, xS, xG, pr };
          s = s + nS - xS;
          g = Math.round((g + nG - xG) * 100) / 100;
        }
      });
      return { M, errs, Y, U };
    }

        h += `<div class="bar noprint"><button class="s" onclick="tab='tk';render()">← Quay lại</button>
              <span>Kỳ in sổ:</span>
              <select id="s10t">${["Tháng", "Quý", "Năm"].map(x => `<option ${x === s10.t ? "selected" : ""}>${x}</option>`).join("")}</select>
              ${s10.t !== "Năm" ? `<select id="s10k">${Array.from({ length: s10.t === "Quý" ? 4 : 12 }, (_, i) => i + 1).map(v => `<option value="${v}" ${v === s10.k ? "selected" : ""}>${s10.t} ${v}</option>`).join("")}</select>` : ""}
              <select id="s10ma" ${scAll ? "disabled" : ""}>${P.map(p => `<option value="${esc(p.ma)}" ${p.ma === scMa ? "selected" : ""}>${esc(p.ma)} - ${esc(p.ten)}</option>`).join("")}</select>
              <label><input id="s10all" type="checkbox" ${scAll ? "checked" : ""}> In tất cả mặt hàng</label>
              <button onclick="window.print()">🖨 In sổ S10-DN</button></div>
              ${b > C.U ? `<div class="st wn">Lưu ý: Kỳ chọn vượt quá tháng đang tính giá (${C.U}).</div>` : ""}
              <div class="sc-wrap">${scAll ? P.filter(p => p.sl || used.has(p.ma)).map(p => led(p.ma, C)).join("") : led(scMa || (P[0] || {}).ma, C)}</div>`;
      } else if (tab === "nk") {
        const R = nkG().map(({ l, s }) => ({ ngay: l.ngay, ph: l.ph, hd: l.hd, nd: l.nd, no: l.no, co: l.co, s, kh: l.kh })).concat(NKX.map(x => ({ ngay: x.ngay, ph: x.ph, hd: x.hd, nd: x.nd, no: x.no, co: x.co, s: x.tien, kh: x.kh }))).sort((a, b) => a.ngay < b.ngay ? -1 : a.ngay > b.ngay ? 1 : 0);
        const tot = R.reduce((a, r) => a + (r.s || 0), 0);
        h += `<div class="bar noprint">${upl("nk")}<button class="s" onclick="tpl('nk')">📄 Tải file mẫu</button><button onclick="window.print()">🖨 In</button><span class="m">${R.length - NKX.length} dòng từ kho + ${NKX.length} bút toán import.</span></div>${coHead()}<h3 style="margin:0">NHẬT KÝ CHUNG - NĂM ${C.Y}</h3><div class="w"><table><thead>${th(["Ngày", "Mã phiếu", "Số HĐ", "Nội dung", "TK Nợ", "TK Có", "Số tiền", "Mã KH/NCC"], [6])}</thead><tbody>${R.slice(0, 3000).map(r => `<tr><td>${r.ngay ? dr(r.ngay) : ""}</td><td>${esc(r.ph)}</td><td>${esc(r.hd)}</td><td>${esc(r.nd)}</td><td>${esc(r.no)}</td><td>${esc(r.co)}</td><td class=n>${fmt(r.s)}</td><td>${esc(r.kh)}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan=6>TỔNG CỘNG</td><td class=n>${fmt(tot)}</td><td></td></tr></tfoot></table></div>`;
      } else if (tab === "kh" || tab === "ncc") {
        const A = tab === "kh" ? KH : NCC, pre = tab === "kh" ? "131" : "331", ps = new Map();
        A.forEach(a => ps.set(a.ma, { ...a, n: 0, c: 0 }));
        nkG().concat(NKX.map(x => ({ l: x, s: x.tien }))).forEach(({ l, s }) => {
          const d = String(l.no).startsWith(pre), c = String(l.co).startsWith(pre);
          if (!l.kh || (!d && !c)) return;
          if (!ps.has(l.kh)) ps.set(l.kh, { ma: l.kh, ten: "(chưa có trong danh mục)", mst: "", dau: 0, n: 0, c: 0 });
          const o = ps.get(l.kh); if (d) o.n += s; if (c) o.c += s;
        });
        const T = [0, 0, 0, 0], rows = [...ps.values()].map(o => {
          const cu = tab === "kh" ? o.dau + o.n - o.c : o.dau + o.c - o.n;
          T[0] += o.dau; T[1] += o.n; T[2] += o.c; T[3] += cu;
          return `<tr><td>${esc(o.ma)}</td><td>${esc(o.ten)}</td><td>${esc(o.mst)}</td><td class=n>${fmt(o.dau)}</td><td class=n>${fmt(o.n)}</td><td class=n>${fmt(o.c)}</td><td class=n>${fmt(cu)}</td></tr>`;
        }).join("");
        h += `<div class="bar">${upl(tab)}<button class="s" onclick="tpl('${tab}')">📄 Tải file mẫu</button></div><div class="w"><table><thead>${th([tab === "kh" ? "Mã KH" : "Mã NCC", tab === "kh" ? "Thông tin khách hàng" : "Thông tin nhà cung cấp", "MST", "Đầu kỳ", "Phát sinh Nợ", "Phát sinh Có", "Cuối kỳ"], [3, 4, 5, 6])}<tr class="tt"><td colspan=3>TỔNG CỘNG</td>${T.map(v => `<td class=n>${fmt(v)}</td>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
      } else if (tab === "cf") {
        h += `<div style="overflow:auto"><h3>Thông tin doanh nghiệp</h3><div class="fm">${[["ten", "Tên đơn vị"], ["dc", "Địa chỉ"], ["mst", "Mã số thuế"], ["tk", "Tài khoản kho (VD 156)"], ["kho", "Tên kho"], ["ghi", "Người ghi sổ"], ["kt", "Kế toán trưởng"], ["dd", "Người đại diện theo pháp luật"]].map(([k, t]) => `<label>${t}</label><input data-c="${k}" value="${esc(CFG[k])}">`).join("")}</div></div>`;
      }
      $("#mn").innerHTML = h;
    }

    document.addEventListener("click", e => {
      const t = e.target.closest("[data-t]");
      if (t) { tab = t.dataset.t; render(); return; }
      const r = e.target.closest("tr[data-row-ma]");
      if (r && tab === "tk") { scMa = r.dataset.rowMa; render(); }
    });
    document.addEventListener("change", e => {
      const t = e.target;
      if (t.dataset.i && t.files[0]) importFile(t.files[0], t.dataset.i);
      else if (t.id === "kt") { kt.t = t.value; kt.k = 1; render(); }
      else if (t.id === "kk") { kt.k = +t.value; render(); }
      else if (t.id === "sp") { scMa = t.value; render(); }
      else if (t.id === "s10t") { s10.t = t.value; s10.k = 1; render(); }
      else if (t.id === "s10k") { s10.k = +t.value; render(); }
      else if (t.id === "s10ma") { scMa = t.value; render(); }
      else if (t.id === "s10all") { scAll = t.checked; render(); }
      else if (t.id === "ctPt") { ctPer.t = t.value; ctPer.k = 1; render(); }
      else if (t.id === "ctPk") { ctPer.k = +t.value; render(); }
      else if (t.id === "ctPy") { ctPer.y = +t.value; render(); }
      else if (t.id === "yr" || t.id === "up") { saveLocal(); render(); }
    });
    document.addEventListener("input", e => {
      if (e.target.id === "q") {
        ctQ = e.target.value; render();
        const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(ctQ.length, ctQ.length); }
      } else if (e.target.dataset.c) {
        CFG[e.target.dataset.c] = e.target.value; saveLocal();
      }
    });

    $("#bexp").onclick = () => {
      const b = new Blob([JSON.stringify({ yr: +$("#yr").value, up: +$("#up").value, P, Ln, NKX, KH, NCC, CFG }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = "so-ke-toan-kho-" + $("#yr").value + ".json";
      a.click();
    };
    $("#fimp").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const d = JSON.parse(await f.text());
        P.length = 0; Ln.length = 0; NKX.length = 0; KH.length = 0; NCC.length = 0;
        if (d.yr) $("#yr").value = d.yr;
        if (d.up != null) $("#up").value = d.up;
        P.push(...(d.P || [])); Ln.push(...(d.Ln || [])); NKX.push(...(d.NKX || []));
        KH.push(...(d.KH || [])); NCC.push(...(d.NCC || [])); Object.assign(CFG, d.CFG || {});
        saveLocal(); st("Đã khôi phục dữ liệu từ file JSON."); render();
      } catch (err) { st("File JSON không hợp lệ.", 1); render(); }
    };
    $("#bclear").onclick = () => {
      $("#mdl").innerHTML = `<div class="modal-bg"><div class="modal"><h3>Xóa toàn bộ dữ liệu?</h3><p>Toàn bộ danh mục, xuất nhập, công nợ đang lưu trên trình duyệt sẽ bị xóa.</p><div class="modal-actions"><button class="s" onclick="document.getElementById('mdl').innerHTML=''">Hủy</button><button class="d" id="m-clr">Xóa tất cả</button></div></div></div>`;
      $("#m-clr").onclick = () => {
        P.length = 0; Ln.length = 0; NKX.length = 0; KH.length = 0; NCC.length = 0; scMa = "";
        localStorage.removeItem(STORE_KEY); $("#mdl").innerHTML = "";
        st("Đã xóa dữ liệu."); render();
      };
    };
    $("#bsample").onclick = () => {
      P.push({ ma: "VPP001", ten: "Giấy A4 Double A 70gsm", dvt: "Ream", sl: 200, gt: 13600000 }, { ma: "VPP002", ten: "Bút bi Thiên Long TL-027", dvt: "Cây", sl: 1000, gt: 3200000 });
      Ln.push({ ph: "NK-0101", ngay: "2026-01-05", hd: "0001234", kh: "NCC01", no: "156", co: "331", nd: "Nhập hàng từ Cty Hoàng Long", ma: "VPP001", sn: 100, gn: 70000, sx: null, gi: null }, { ph: "XK-0101", ngay: "2026-01-10", hd: "0000101", kh: "KH01", no: "632", co: "156", nd: "Xuất bán cho Cty ABC", ma: "VPP001", sn: null, gn: null, sx: 120, gi: null });
      KH.push({ ma: "KH01", ten: "Công ty ABC", mst: "0301234567", dau: 5000000 });
      NCC.push({ ma: "NCC01", ten: "Công ty Hoàng Long", mst: "0101234567", dau: 12000000 });
      Object.assign(CFG, { ten: "CÔNG TY TNHH MINH ANH", dc: "128 Nguyễn Thị Minh Khai, Q3, TP.HCM", mst: "0314567890" });
      saveLocal(); st("Đã nạp dữ liệu mẫu."); render();
    };

    loadLocal();
    render();
  </script>
</body>
</html>
