<!DOCTYPE html>
<html lang="vi">
<head>

      --er: #fee2e2;
      --er-fg: #991b1b;
      --warn: #fef3c7;
      --warn-fg: #92400e;

      :root:not([data-theme=light]) {
        --bg: #020617;
        --surface: #0f172a;
        --fg: #f1f5f9;
        --mut: #94a3b8;
        --line: #1e293b;
        --hd: #1e293b;
        --hf: #f8fafc;
        --ac: #3b82f6;
        --ok: #14532d;
        --ok-fg: #bbf7d0;
        --er: #7f1d1d;
        --er-fg: #fecaca;
        --warn: #78350f;
        --warn-fg: #fde68a;
        --card: #1e293b;
        --sel: #172554;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    header {
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .hdr-l, .hdr-r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    h1 { font-size: 20px; margin: 0 8px 0 0; color: var(--ac); font-weight: 700; white-space: nowrap; }
    button, select, input {
      font: inherit;
      color: var(--fg);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 9px;
    }
    button {
      cursor: pointer;
      background: var(--ac);
      color: #fff;
      border-color: var(--ac);
      font-weight: 600;
      white-space: nowrap;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.s { background: var(--surface); color: var(--fg); border-color: var(--line); font-weight: 500; }
    button.d { background: #dc2626; border-color: #dc2626; color: #fff; }
    input[type=number] { width: 68px; }
    nav {
      display: flex;
      gap: 4px;
      padding: 6px 14px 0;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      flex-shrink: 0;
    }
    nav button {
      background: transparent;
      color: var(--mut);
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      padding: 7px 11px;
      font-weight: 600;
    }
    nav button.on { color: var(--ac); border-bottom-color: var(--ac); }
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      gap: 8px;
    }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
    .w {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    table { border-collapse: collapse; width: 100%; white-space: nowrap; font-size: 15px; }
    thead { position: sticky; top: 0; z-index: 2; }
    tfoot { position: sticky; bottom: 0; z-index: 2; }
    th {
      background: var(--hd);
      color: var(--hf);
      padding: 7px 8px;
      font-weight: 600;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }
    th.n { text-align: right; }
    th.sort { cursor: pointer; user-select: none; }
    th.sort:hover { background: #334155; }
    td { padding: 5px 8px; border-top: 1px solid var(--line); }
    td.n { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    tr:hover td { background: rgba(148, 163, 184, 0.08); }
    tr.sel td { background: var(--sel) !important; }
    tr.br td { background: rgba(59, 130, 246, 0.08); }
    tr.er td { background: var(--er); color: var(--er-fg); }
    tr.tt td, tfoot td { font-weight: 700; background: var(--card); color: var(--fg); }
    tfoot td { border-top: 1px solid var(--line); }
    .m { color: var(--mut); font-size: 15px; }
    .st {
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--ok);
      color: var(--ok-fg);
      font-size: 15px;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .st.er { background: var(--er); color: var(--er-fg); }
    .st.wn { background: var(--warn); color: var(--warn-fg); }
    .fm { display: grid; grid-template-columns: 230px minmax(0, 440px); gap: 8px; align-items: center; }
    .sg { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-top: 16px; gap: 12px; }
    .sc-wrap { flex: 1; min-height: 0; overflow: auto; }
    .sc {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px 22px;
      margin-bottom: 14px;
    }
    .sc table { white-space: normal; }
    .sc th, .sc td { border: 1px solid var(--line); padding: 4px 6px; }
    .sc th { text-align: center; }
    .pvs, .co { display: none; }
    body.pv .w, body.pv .bar, body.pv .st, body.pv h3 { display: none !important; }
    body.pv .pvs { display: block; }
    .pvs table { white-space: normal; }
    .pvs th, .pvs td { border: 1px solid #cbd5e1; }
    .modal-bg {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(15, 23, 42, 0.55);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal {
      width: 100%; max-width: 520px;
      background: var(--surface); color: var(--fg);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 20px; box-shadow: 0 20px 35px rgba(0, 0, 0, 0.25);
    }
    .modal h3 { margin: 0 0 8px; font-size: 19px; }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .only-prn { display: none; }
    .err-btn { background: var(--er); color: var(--er-fg); border-color: #fca5a5; }
    .err-btn.on { background: #dc2626; color: #fff; border-color: #dc2626; }
    .nk-gc { width: 195px; padding: 3px 6px; font-size: 15px; border-color: transparent; background: transparent; }
    .nk-gc:hover, .nk-gc:focus { border-color: var(--line); background: var(--surface); }
    @media print {
      html, body { height: auto !important; overflow: visible !important; background: #fff !important; color: #000 !important; font-size: 12px !important; }
      header, nav, .bar, .noprint, .st, .modal-bg { display: none !important; }
      .only-prn { display: inline !important; }
      tr.hide-prn { display: none !important; }
      main { padding: 0 !important; display: block !important; }
      .w, .sc-wrap { overflow: visible !important; max-height: none !important; border: 0 !important; }
      .sc { border: 0 !important; padding: 0 !important; margin: 0 !important; }
      thead, tfoot { position: static !important; }
      table { font-size: 11px !important; }
      th { background: #e2e8f0 !important; color: #000 !important; border: 1px solid #94a3b8 !important; }
      td { border: 1px solid #cbd5e1 !important; color: #000 !important; }
      .co { display: block; margin-bottom: 6px; }
      .pb { page-break-after: always; break-after: page; }
    }
  </style>
</head>

        tien: ["sotien", "giatri"], kh: ["makhmancc", "makh", "mancc"],
        gc: ["ghichu", "gc", "note"]
      },
      cdsps: {
        tk: ["sohieutk", "taikhoan", "matk", "tk", "sotk"],
        ten: ["tentaikhoan", "ten"],
        no: ["duno", "dunodauky", "nodauky", "soduno", "no"],
        co: ["duco", "ducodauky", "codauky", "soduco", "co"]
      },
      kh: {
        ma: ["makh", "ma", "makhachhang"],
        ten: ["thongtinkhachhang", "thongtin", "tenkhachhang", "ten"],
        mst: ["mst", "masothue"],
        dau: ["dauky", "sodudauky", "dudauky"]
      },
      ncc: {
        ma: ["mancc", "ma", "manhacungcap"],
        ten: ["thongtinnhacungcap", "thongtinkhachhang", "thongtin", "tennhacungcap", "ten"],
        mst: ["mst", "masothue"],
        dau: ["dauky", "sodudauky", "dudauky"]
      }
    };

    function toDate(v) {
      if (v instanceof Date && !isNaN(v.getTime())) return new Date(v.getTime() - v.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
      if (typeof v === "number") return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
      const m = String(v || "").trim().match(/^(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{4})$/);
      if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
      return String(v || "").slice(0, 10);
    }

    function mqyInfo(ngay) {
      if (!ngay || ngay.length < 7) return null;
      const y = +ngay.slice(0, 4), m = +ngay.slice(5, 7);
      if (!y || !m || m < 1 || m > 12) return null;
      return { y, m, q: Math.ceil(m / 3) };
    }

    function showDuplicateModal(targetArr, incoming, overlapKeys, cols, isVpdd) {
      const labels = overlapKeys.map(ym => {
        const [y, m] = ym.split("-");
        return `Tháng ${m}/${y} (Quý ${Math.ceil(+m / 3)})`;
      });
      const overlapSet = new Set(overlapKeys);
      const hasOther = targetArr.some(l => l.ngay && l.ngay.length >= 7 && !overlapSet.has(l.ngay.slice(0, 7)));

      $("#mdl").innerHTML = `
        <div class="modal-bg">
          <div class="modal">
            <h3>Xác nhận import dữ liệu trùng kỳ</h3>
            <p style="margin:6px 0 10px"><b>Kỳ xuất nhập kho này đã có dữ liệu. Bạn muốn import thêm vào dữ liệu đã có sẵn hay import đè xóa hoàn toàn dữ liệu cũ?</b></p>
            <div class="st wn" style="display:block">Kỳ trùng: ${esc(labels.join(", "))} (Hiện có ${targetArr.length} dòng · File mới ${incoming.length} dòng)</div>
            <div class="modal-actions">
              <button class="s" id="m-cancel">Hủy</button>
              ${hasOther ? `<button class="s" id="m-rep">Chỉ ghi đè kỳ trùng</button>` : ""}
              <button class="d" id="m-over">Ghi đè (Xóa dữ liệu cũ)</button>
              <button id="m-app">Ghi thêm</button>
            </div>
          </div>
        </div>`;

      const close = () => { $("#mdl").innerHTML = ""; };
      $("#m-cancel").onclick = close;
      $("#m-app").onclick = () => {
        targetArr.push(...incoming);
        if (!isVpdd && targetArr[0]?.ngay) $("#yr").value = targetArr[0].ngay.slice(0, 4);
        st(`Đã ghi thêm ${incoming.length} dòng vào dữ liệu sẵn có. Cột: ${cols}`);
        close(); saveLocal(); render();
      };
      $("#m-over").onclick = () => {
        targetArr.length = 0; targetArr.push(...incoming);
        if (!isVpdd && targetArr[0]?.ngay) $("#yr").value = targetArr[0].ngay.slice(0, 4);
        st(`Đã ghi đè (xóa dữ liệu cũ), giữ ${incoming.length} dòng mới. Cột: ${cols}`);
        close(); saveLocal(); render();
      };
      if (hasOther) {
        $("#m-rep").onclick = () => {
          const kept = targetArr.filter(l => !l.ngay || l.ngay.length < 7 || !overlapSet.has(l.ngay.slice(0, 7)));
          targetArr.length = 0; targetArr.push(...kept, ...incoming);
          st(`Đã thay thế riêng kỳ trùng bằng ${incoming.length} dòng mới. Cột: ${cols}`);
          close(); saveLocal(); render();
        };
      }
    }

    function importFile(f, kind) {
      const r = new FileReader();
      r.onload = e => {
        try {
          const wb = XLSX.read(e.target.result, { type: "array", cellDates: true });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          const eff = (kind === "tk" || kind === "tk_vpdd") ? "dm" : kind === "ct_vpdd" ? "ct" : kind;
          const spec = mk[eff];
          const map = {};
          if (rows.length) {
            Object.keys(rows[0]).forEach(h => {
              const n = norm(h);
              for (const k in spec) if (spec[k].includes(n) && !(k in map)) map[k] = h;
            });
          }
          const g = (r, k) => map[k] ? r[map[k]] : "";
          const num = v => v === "" ? null : Number(String(v).replace(/,/g, ""));
          const cols = Object.keys(map).join(", ") || "không có - kiểm tra tiêu đề cột";

          if (kind === "dm" || kind === "tk") {
            P.length = 0;
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim();
              if (ma) {
                const sl = num(g(r, "sl")) || 0, dg = Math.round(num(g(r, "dg")) || 0);
                P.push({ ma, ten: String(g(r, "ten") ?? ""), dvt: String(g(r, "dvt") ?? ""), sl, gt: Math.round(num(g(r, "gt")) ?? sl * dg) });
              }
            });
          } else if (kind === "tk_vpdd") {
            for (const k in vpddOpening) delete vpddOpening[k];
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim();
              if (ma) {
                const sl = num(g(r, "sl")) || 0, dg = Math.round(num(g(r, "dg")) || 0);
                vpddOpening[ma] = { sl, gt: Math.round(num(g(r, "gt")) ?? sl * dg) };
              }
            });
          } else if (kind === "cdsps") {
            tkOpening.length = 0;
            rows.forEach(r => {
              const tk = String(g(r, "tk")).trim();
              if (tk) tkOpening.push({ tk, ten: String(g(r, "ten") ?? "").trim(), no: Math.round(num(g(r, "no")) || 0), co: Math.round(num(g(r, "co")) || 0) });
            });
          } else if (kind === "nk") {
            NKX.length = 0;
            rows.forEach(r => {
              const ph = String(g(r, "ph")).trim(), t = num(g(r, "tien"));
              if (ph || t) NKX.push({
                ngay: toDate(g(r, "ngay")), ph, hd: String(g(r, "hd")),
                nd: String(g(r, "nd")), no: String(g(r, "no")), co: String(g(r, "co")),
                tien: Math.round(t || 0), kh: String(g(r, "kh")), gc: String(g(r, "gc") ?? "")
              });
            });
          } else if (kind === "kh" || kind === "ncc") {
            const A = kind === "kh" ? KH : NCC;
            A.length = 0;
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim();
              if (ma) A.push({ ma, ten: String(g(r, "ten")), mst: String(g(r, "mst")), dau: Math.round(num(g(r, "dau")) || 0) });
            });
          } else {
            const isVpdd = kind === "ct_vpdd";
            const targetArr = isVpdd ? LnVPDD : Ln;
            const incoming = [];
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim(), ph = String(g(r, "ph")).trim();
              if (ma || ph) {
                const gn = num(g(r, "gn")), gi = num(g(r, "gi"));
                incoming.push({
                  id: uid(), ph, ngay: toDate(g(r, "ngay")), hd: String(g(r, "hd")), kh: String(g(r, "kh")),
                  no: String(g(r, "no")), co: String(g(r, "co")), nd: String(g(r, "nd")),
                  ma, sn: num(g(r, "sn")), gn: gn != null ? Math.round(gn) : null,
                  sx: num(g(r, "sx")), gi: gi != null ? Math.round(gi) : null
                });
              }
            });
            if (targetArr.length > 0) {
              const existSet = new Set(targetArr.map(l => l.ngay ? l.ngay.slice(0, 7) : "").filter(Boolean));
              const overlap = [...new Set(incoming.map(l => l.ngay ? l.ngay.slice(0, 7) : "").filter(ym => ym && existSet.has(ym)))].sort();
              if (overlap.length > 0) {
                showDuplicateModal(targetArr, incoming, overlap, cols, isVpdd);
                return;
              }
              targetArr.push(...incoming);
              if (incoming[0]?.ngay) { $("#yr").value = incoming[0].ngay.slice(0, 4); ctPer.y = vpddPer.y = +$("#yr").value; }
              st(`Đã ghi thêm ${incoming.length} dòng kỳ mới. Cột nhận diện: ${cols}`);
              saveLocal(); render(); return;
            }
            targetArr.length = 0; targetArr.push(...incoming);
            if (targetArr[0]?.ngay) { $("#yr").value = targetArr[0].ngay.slice(0, 4); ctPer.y = vpddPer.y = +$("#yr").value; }
          }
          st(`Đã đọc ${rows.length} dòng. Cột nhận diện: ${cols}`);
          saveLocal(); render();
        } catch (x) {
          st("Lỗi đọc file: " + x.message, 1); render();
        }
      };
      r.readAsArrayBuffer(f);
    }

    function calcSet(products, lines) {
      const Y = +$("#yr").value, U = +$("#up").value;
      const pm = {}; products.forEach(p => pm[p.ma] = p);
      const M = {}; products.forEach(p => M[p.ma] = {});
      const first = {}, errs = new Map();
      lines.forEach(l => {
        l._m = l.ngay && +l.ngay.slice(0, 4) === Y ? +l.ngay.slice(5, 7) : 0;
        l.gn = l.gn != null ? Math.round(l.gn) : null;
        l.gtn = l.sn != null ? Math.round(l.sn * (l.gn || 0)) : null;
        l.px = null;
        l.gx = null;
        let e = "";
        if (!l.ph) e = "Thiếu mã phiếu";
        else if (!l.ngay) e = "Thiếu ngày";
        else if (first[l.ph] && first[l.ph].ngay !== l.ngay) e = `Mã phiếu bị trùng, đã có ở ngày ${dr(first[l.ph].ngay)} - vui lòng kiểm tra lại`;
        else if (!pm[l.ma]) e = "Mã hàng chưa có trong danh mục";
        if (l.ph && !first[l.ph]) first[l.ph] = l;
        if (e) errs.set(l, e);
      });
      products.forEach(p => {
        let s = p.sl, g = Math.round(p.gt);
        for (let m = 1; m <= U; m++) {
          const ls = lines.filter(l => l.ma === p.ma && l._m === m).sort((a, b) => a.ngay < b.ngay ? -1 : a.ngay > b.ngay ? 1 : 0);
          let nS = 0, nG = 0, xS = 0;
          ls.forEach(l => { nS += l.sn || 0; nG += l.gtn || 0; xS += l.sx || 0; });
          const availS = s + nS, availG = Math.max(0, Math.round(g + nG));
          const pr = availS > 0 ? Math.round(availG / availS) : 0;
          const exps = ls.filter(l => (l.sx || 0) > 0);
          const endS = availS - xS;
          let cumGx = 0;
          exps.forEach((l, idx) => {
            const qty = l.sx || 0;
            const remG = Math.max(0, availG - cumGx);
            if (idx === exps.length - 1 && endS <= 0) {
              l.gx = remG;
              l.px = qty > 0 ? Math.round(l.gx / qty) : 0;
            } else {
              const unitP = l.gi != null ? Math.round(l.gi) : pr;
              l.gx = Math.min(remG, Math.max(0, Math.round(qty * unitP)));
              l.px = unitP;
            }
            cumGx += l.gx || 0;
          });
          M[p.ma][m] = { dS: s, dG: g, nS, nG, xS, xG: cumGx, pr };
          s = Math.max(0, availS - xS);
          g = s === 0 ? 0 : Math.max(0, availG - cumGx);
        }
      });
      return { M, errs, Y, U };
    }

    function getVpddProducts() {
      return P.map(p => ({ ma: p.ma, ten: p.ten, dvt: p.dvt, sl: vpddOpening[p.ma]?.sl || 0, gt: Math.round(vpddOpening[p.ma]?.gt || 0) }));
    }

    function getVpddLines() {
      const autoIn = Ln.filter(isBranch1368).map(l => ({
        ph: l.ph, ngay: l.ngay, hd: l.hd, kh: l.kh,
        no: "1368", co: "156", nd: l.nd || "Nhập kho VPĐD từ Công ty (Nợ 1368 / Có 156)",
        ma: l.ma, sn: l.sx, gn: l.px != null ? Math.round(l.px) : (l.gx != null && l.sx ? Math.round(l.gx / l.sx) : 0),
        sx: null, gi: null, _auto: 1
      }));
      return autoIn.concat(LnVPDD.map(l => Object.assign(l, { _auto: 0 })));
    }

    function rangeOf(per) {
      return per.t === "Năm" ? [1, 12] : per.t === "Quý" ? [3 * per.k - 2, 3 * per.k] : [per.k, per.k];
    }

    const th = (a, numIdx = []) => "<tr>" + a.map((x, i) => `<th class="${numIdx.includes(i) ? "n" : ""}">${x}</th>`).join("") + "</tr>";
    const upl = k => `<label class="noprint"><input type="file" accept=".xlsx,.xls,.csv" data-i="${k}" style="display:none"><button type="button" onclick="this.previousElementSibling.click()">📂 Import Excel/CSV</button></label>`;
    const coHead = () => `<div class="co"><b>${esc(CFG.ten)}</b><br>${esc(CFG.dc)}${CFG.mst ? " - MST: " + esc(CFG.mst) : ""}</div>`;

    function nkG(C) {
      const g = new Map();
      Ln.forEach(l => {
        if (!l.ph || l._m < 1 || l._m > C.U) return;
        const k = l.ph + "|" + l.kh;
        if (!g.has(k)) g.set(k, { l, s: 0 });
        g.get(k).s += (l.gtn || 0) + (l.gx || 0);
      });
      return [...g.values()];
    }

    function vch(x, linesSrc, prodsSrc) {
      const ls = linesSrc.filter(l => l.ph === x), l0 = ls[0];
      if (!l0) return "";
      let tot = 0;
      return `<div class="pb"><h2 style="text-align:center">PHIẾU ${ls.some(l => l.sn != null) ? "NHẬP" : "XUẤT"} KHO</h2><p>Mã phiếu: <b>${esc(x)}</b> &nbsp; Ngày: ${dr(l0.ngay)} &nbsp; Số HĐ: ${esc(l0.hd)} &nbsp; KH/NCC: ${esc(l0.kh)}<br>TK Nợ/Có: ${esc(l0.no)} / ${esc(l0.co)}<br>Nội dung: ${esc(l0.nd)}</p><table><thead>${th(["STT", "Mã hàng", "Tên hàng", "ĐVT", "SL", "Đơn giá", "Thành tiền"], [4, 5, 6])}</thead><tbody>${ls.map((l, i) => {
        const p = prodsSrc.find(y => y.ma === l.ma) || {}, n = l.sn != null, gt = n ? l.gtn : (l.gx != null ? l.gx : 0);
        tot += gt || 0;
        return `<tr><td>${i + 1}</td><td>${esc(l.ma)}</td><td>${esc(p.ten)}</td><td>${esc(p.dvt)}</td><td class=n>${fmt(n ? l.sn : l.sx)}</td><td class=n>${fmt(n ? l.gn : l.px)}</td><td class=n>${fmt(gt)}</td></tr>`;
      }).join("")}<tr class="tt"><td colspan=6>CỘNG</td><td class=n>${fmt(tot)}</td></tr></tbody></table><div class="sg"><span>Người lập phiếu</span><span>Thủ kho</span><span>Kế toán trưởng</span></div></div>`;
    }

    function led(ma, C, prodsSrc, linesSrc, tkOv, khoOv) {
      const p = prodsSrc.find(x => x.ma === ma);
      if (!p) return "";
      const [a, b] = rangeOf(s10), effB = Math.min(b, C.U), pm = C.M[ma] || {};
      let s = p.sl, g = Math.round(p.gt);
      if (C.U === 0) { s = p.sl; g = Math.round(p.gt); }
      else if (a <= C.U && pm[a]) { s = pm[a].dS; g = pm[a].dG; }
      else if (pm[C.U]) { const z = pm[C.U]; s = Math.max(0, z.dS + z.nS - z.xS); g = s === 0 ? 0 : Math.max(0, Math.round(z.dG + z.nG - z.xG)); }

      const e = "<td></td>", nn = v => `<td class=n>${fmt(v)}</td>`;
      let R = `<tr>${e}${e}<td>Số dư đầu kỳ</td>${e.repeat(6)}${nn(s)}${nn(g)}${e}</tr>`;
      let pNS = 0, pNG = 0, pXS = 0, pXG = 0;

      for (let m = a; m <= effB; m++) {
        const ls = linesSrc.filter(l => l.ma === ma && l._m === m).sort((x, y) => x.ngay < y.ngay ? -1 : x.ngay > y.ngay ? 1 : 0);
        if (!ls.length) continue;
        let nS = 0, nG = 0, xS = 0, xG = 0;
        ls.forEach(l => {
          const n = l.sn != null, q = (n ? l.sn : l.sx) || 0, tt = n ? (l.gtn || 0) : (l.gx || 0);
          if (n) { nS += q; nG += tt; s += q; g += tt; }
          else { xS += q; xG += tt; s = Math.max(0, s - q); g = s === 0 ? 0 : Math.max(0, g - tt); }
          R += `<tr><td>${esc(l.ph)}</td><td>${dr(l.ngay)}</td><td>${esc(l.nd)}</td><td style="text-align:center">${esc(n ? l.co : l.no)}</td><td class=n>${fmt(n ? l.gn : l.px)}</td>${n ? nn(q) + nn(tt) + e + e : e + e + nn(q) + nn(tt)}${nn(s)}${nn(g)}${e}</tr>`;
        });
        pNS += nS; pNG += nG; pXS += xS; pXG += xG;
        R += `<tr class="tt">${e}${e}<td>Cộng tháng ${m}</td><td style="text-align:center">x</td><td style="text-align:center">x</td>${nn(nS)}${nn(nG)}${nn(xS)}${nn(xG)}${nn(s)}${nn(g)}${e}</tr>`;
      }
      const endLbl = s10.t === "Tháng" ? `Số dư cuối tháng ${s10.k}` : s10.t === "Quý" ? `Cộng phát sinh Quý ${s10.k} / Số dư cuối kỳ` : `Cộng phát sinh Năm ${C.Y} / Số dư cuối năm`;
      R += `<tr class="tt">${e}${e}<td>${endLbl}</td><td style="text-align:center">x</td><td style="text-align:center">x</td>${nn(pNS)}${nn(pNG)}${nn(pXS)}${nn(pXG)}${nn(s)}${nn(g)}${e}</tr>`;

      const hd = `<thead><tr><th colspan=2>Chứng từ</th><th rowspan=2>Diễn giải</th><th rowspan=2>TK đối ứng</th><th rowspan=2>Đơn giá</th><th colspan=2>Nhập</th><th colspan=2>Xuất</th><th colspan=2>Tồn</th><th rowspan=2>Ghi chú</th></tr><tr><th>Số hiệu</th><th>Ngày, tháng</th><th>Số lượng</th><th>Thành tiền</th><th>Số lượng</th><th>Thành tiền</th><th>Số lượng</th><th>Thành tiền</th></tr><tr class="m">${["A", "B", "C", "D", "1", "2", "3=1x2", "4", "5=(1x4)", "6", "7=(1x6)", "8"].map(x => `<td align=center><i>${x}</i></td>`).join("")}</tr></thead>`;
      const sg = (t, n) => `<span><b>${t}</b><br><i>(Ký, họ tên)</i><br><br><br>${esc(n)}</span>`;
      const perTitle = s10.t === "Năm" ? `Năm ${C.Y}` : s10.t === "Quý" ? `Quý ${s10.k} năm ${C.Y} (Tháng ${a} - Tháng ${b})` : `Tháng ${String(s10.k).padStart(2, "0")} năm ${C.Y}`;

      return `<div class="pb sc"><div style="display:flex;justify-content:space-between;gap:20px"><div><b>Đơn vị: ${esc(CFG.ten)}</b><br>Địa chỉ: ${esc(CFG.dc)}</div><div style="max-width:320px;font-size:12px"><b>Mẫu số S10-DN</b><br><i>(Kèm theo Thông tư số 99/2025/TT-BTC ngày 27 tháng 10 năm 2025 của Bộ trưởng Bộ Tài chính)</i></div></div><h3 style="text-align:center;margin:10px 0 2px">SỔ CHI TIẾT SẢN PHẨM, HÀNG HOÁ</h3><div style="text-align:center"><i>${perTitle}</i><br><b>Tài khoản: ${esc(tkOv || CFG.tk)} &nbsp; Tên kho: ${esc(khoOv || CFG.kho)}</b></div><p>Mã hàng hóa: <b>${esc(p.ma)}</b><br>Tên hàng hóa: <b>${esc(p.ten)}</b> (${esc(p.dvt)})<br><i>Đơn vị tính: vnđ</i></p><div style="overflow-x:auto"><table>${hd}<tbody>${R}</tbody></table></div><p>- Sổ này có ... trang, đánh số từ trang 01 đến trang ...<br>- Ngày mở sổ: 01/${String(a).padStart(2, "0")}/${C.Y}</p><div class="sg">${sg("Người ghi sổ", CFG.ghi)}${sg("Kế toán trưởng", CFG.kt)}<span><i>Ngày..... tháng.... năm ${C.Y}</i><br><b>Người đại diện theo pháp luật</b><br><i>(Ký, họ tên, đóng dấu)</i><br><br><br>${esc(CFG.dd)}</span></div></div>`;
    }

    function openSc(all, ma, isVpdd = false) {
      scAll = all;
      if (isVpdd) {
        if (ma) scVpddMa = ma;
        else if (!all && $("#sp")) scVpddMa = $("#sp").value;
        s10 = { ...ktVpdd };
        tab = "sc_vpdd";

    function applySort(arr, sortObj, errTop) {

      return [...arr].sort((a, b) => {
        if (errTop) {
          const ae = a._err ? 1 : 0, be = b._err ? 1 : 0;
          if (ae !== be) return be - ae;
        }
        if (!k) return 0;
        if (numK.has(k)) return ((a[k] ?? -Infinity) - (b[k] ?? -Infinity)) * d;
        let av = "", bv = "";
        if (k === "ten") { av = (P.find(p => p.ma === a.ma) || {}).ten || ""; bv = (P.find(p => p.ma === b.ma) || {}).ten || ""; }

        else if (k === "src") { av = a._auto ? "1" : "0"; bv = b._auto ? "1" : "0"; }
        else if (k === "err") { av = a._err || ""; bv = b._err || ""; }
        else { av = String(a[k] ?? ""); bv = String(b[k] ?? ""); }
        return av.localeCompare(bv, "vi") * d;
      });

    function buildCdsps(cir, nkRows, Y, per) {
      const [a, b] = rangeOf(per);
      const cat = cir === "TT99" ? ACCOUNTS_TT99 : ACCOUNTS_TT200;
      const nameMap = new Map(cat);
      const openMap = new Map();
      const setAll = new Set(cat.map(x => x[0]));
      tkOpening.forEach(o => {
        const tk = String(o.tk || "").trim();
        if (!tk) return;
        setAll.add(tk);
        if (o.ten && !nameMap.has(tk)) nameMap.set(tk, o.ten);
        const cur = openMap.get(tk) || { no: 0, co: 0 };
        openMap.set(tk, { no: cur.no + Math.round(o.no || 0), co: cur.co + Math.round(o.co || 0) });
      });
      const prN = new Map(), prC = new Map(), pN = new Map(), pC = new Map();
      nkRows.forEach(r => {
        const no = String(r.no || "").trim(), co = String(r.co || "").trim();
        if (no) setAll.add(no);
        if (co) setAll.add(co);
        if (!r.ngay || r.ngay.length < 7) return;
        const ry = +r.ngay.slice(0, 4), rm = +r.ngay.slice(5, 7);
        if (ry !== Y) return;
        const amt = Math.round(r.s || 0);
        if (rm >= 1 && rm < a) {
          if (no) prN.set(no, (prN.get(no) || 0) + amt);
          if (co) prC.set(co, (prC.get(co) || 0) + amt);
        } else if (rm >= a && rm <= b) {
          if (no) pN.set(no, (pN.get(no) || 0) + amt);
          if (co) pC.set(co, (pC.get(co) || 0) + amt);
        }
      });
      const tot = { dNo: 0, dCo: 0, pNo: 0, pCo: 0, cNo: 0, cCo: 0 };
      const rows = [...setAll].sort((x, y) => x.localeCompare(y, "en")).map(tk => {
        const op = openMap.get(tk) || { no: 0, co: 0 };
        const netOp = op.no + (prN.get(tk) || 0) - (op.co + (prC.get(tk) || 0));
        const dNo = netOp > 0 ? netOp : 0, dCo = netOp < 0 ? -netOp : 0;
        const psNo = pN.get(tk) || 0, psCo = pC.get(tk) || 0;
        const netEnd = dNo + psNo - (dCo + psCo);
        const cNo = netEnd > 0 ? netEnd : 0, cCo = netEnd < 0 ? -netEnd : 0;
        tot.dNo += dNo; tot.dCo += dCo; tot.pNo += psNo; tot.pCo += psCo; tot.cNo += cNo; tot.cCo += cCo;
        return {
          tk, ten: nameMap.get(tk) || "(Tài khoản chi tiết)", dNo, dCo, pNo: psNo, pCo: psCo, cNo, cCo,
          hasAny: dNo !== 0 || dCo !== 0 || psNo !== 0 || psCo !== 0 || cNo !== 0 || cCo !== 0,
          hasPer: psNo !== 0 || psCo !== 0
        };
      });
      return { rows, tot };
    }

        ...act.map(r => [r.tk, r.ten, r.dNo, r.dCo, r.pNo, r.pCo, r.cNo, r.cCo]),
        ["", "TỔNG CỘNG", tot.dNo, tot.dCo, tot.pNo, tot.pCo, tot.cNo, tot.cCo]
      ];
    }

    function perCtrlHtml(pfx, per, lbl = "Kỳ:") {

        <select id="${pfx}Pt">${["Tất cả", "Tháng", "Quý", "Năm"].map(x => `<option ${x === per.t ? "selected" : ""}>${x}</option>`).join("")}</select>
        ${per.t === "Tháng" ? `<select id="${pfx}Pk">${Array.from({ length: 12 }, (_, i) => i + 1).map(m => `<option value="${m}" ${m === per.k ? "selected" : ""}>Tháng ${String(m).padStart(2, "0")}</option>`).join("")}</select>` : ""}
        ${per.t === "Quý" ? `<select id="${pfx}Pk">${[1, 2, 3, 4].map(q => `<option value="${q}" ${q === per.k ? "selected" : ""}>Quý ${q}</option>`).join("")}</select>` : ""}
        ${per.t !== "Tất cả" ? `<input id="${pfx}Py" type="number" value="${per.y}">` : ""}`;
    }

    function catThHtml(cols, sortObj, kind) {
      return "<tr>" + cols.map(([k, lbl, isN]) => {
        if (!k) return `<th class="noprint">${lbl}</th>`;
        const ind = sortObj.k === k ? (sortObj.d === 1 ? " ▲" : " ▼") : " ⇅";
        return `<th class="sort ${isN ? "n" : ""}" data-csort="${k}" data-ckind="${kind}" title="Bấm để sắp xếp">${lbl}<span style="opacity:.6;font-size:12px">${ind}</span></th>`;
      }).join("") + "</tr>";
    }

    function getFilteredDm() {
      const q = dmQ.trim().toLowerCase();
      let actSet = null;
      if (dmPer.t !== "Tất cả") {
        actSet = new Set();
        Ln.forEach(l => { if (matchesPer(l.ngay, dmPer) && l.ma) actSet.add(l.ma); });
        LnVPDD.forEach(l => { if (matchesPer(l.ngay, dmPer) && l.ma) actSet.add(l.ma); });
      }
      const list = P.filter(p => {
        if (actSet && !actSet.has(p.ma)) return false;
        if (q && !(p.ma + " " + p.ten + " " + p.dvt).toLowerCase().includes(q)) return false;
        return true;
      });
      if (!dmSort.k) return list;
      const k = dmSort.k, d = dmSort.d;
      return [...list].sort((a, b) => {
        if (k === "sl" || k === "gt" || k === "dg") {
          const av = k === "sl" ? (a.sl || 0) : k === "gt" ? Math.round(a.gt || 0) : (a.sl ? Math.round(a.gt / a.sl) : 0);
          const bv = k === "sl" ? (b.sl || 0) : k === "gt" ? Math.round(b.gt || 0) : (b.sl ? Math.round(b.gt / b.sl) : 0);
          return (av - bv) * d;
        }
        return String(a[k] ?? "").localeCompare(String(b[k] ?? ""), "vi") * d;
      });
    }

    function getFilteredNk(C) {
      const q = nkQ.trim().toLowerCase();
      return buildNkRows(C).filter(r => {
        if (!matchesPer(r.ngay, nkPer)) return false;
        if (q && !(r.ph + " " + r.hd + " " + r.nd + " " + r.no + " " + r.co + " " + r.kh + " " + r.gc).toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function getFilteredCt(isVpdd, C, linesSrc) {
      const qVal = isVpdd ? vpddQ : ctQ, per = isVpdd ? vpddPer : ctPer, sortObj = isVpdd ? vpddSort : ctSort;
      const errTop = isVpdd ? vpddErrTop : ctErrTop, onlyErr = isVpdd ? vpddOnlyErr : ctOnlyErr;
      const q = qVal.trim().toLowerCase();
      const ls = linesSrc.filter(l => {
        l._err = C.errs.get(l) || "";
        if (onlyErr && !l._err) return false;
        if (q && !(l.ph + l.ma + l.kh + l.nd + l.no + l.co).toLowerCase().includes(q)) return false;
        return matchesPer(l.ngay, per);
      });
      return applySort(ls, sortObj, errTop);
    }

    function computeTkSummary(isVpdd, C, prodsSrc, linesSrc, qStr = "") {
      const per = isVpdd ? ktVpdd : kt;
      const [a, b] = rangeOf(per);
      const actCodes = new Set(linesSrc.map(l => l.ma));
      const q = qStr.trim().toLowerCase();
      const list = prodsSrc.filter(p => {
        if (isVpdd && !vpddShowAll && !(p.sl > 0 || p.gt > 0 || actCodes.has(p.ma))) return false;
        if (q && !(p.ma + " " + p.ten + " " + p.dvt).toLowerCase().includes(q)) return false;
        return true;
      });
      const T = { dS: 0, dG: 0, nS: 0, nG: 0, xS: 0, xG: 0, cS: 0, cG: 0 };
      const rows = list.map(p => {
        const m = C.M[p.ma] || {}, f = m[a];
        let dS = f ? f.dS : 0, dG = f ? f.dG : 0;
        if (!f && C.U === 0) { dS = p.sl; dG = Math.round(p.gt); }
        else if (!f && a > C.U && m[C.U]) { const z = m[C.U]; dS = Math.max(0, z.dS + z.nS - z.xS); dG = dS === 0 ? 0 : Math.max(0, Math.round(z.dG + z.nG - z.xG)); }
        let nS = 0, nG = 0, xS = 0, xG = 0;
        for (let i = a; i <= b; i++) if (m[i]) { nS += m[i].nS; nG += m[i].nG; xS += m[i].xS; xG += m[i].xG; }
        const cS = Math.max(0, dS + nS - xS), cG = cS === 0 ? 0 : Math.max(0, Math.round(dG + nG - xG));
        T.dS += dS; T.dG += dG; T.nS += nS; T.nG += nG; T.xS += xS; T.xG += xG; T.cS += cS; T.cG += cG;
        return { ma: p.ma, ten: p.ten, dvt: p.dvt, dS, dDG: dS ? Math.round(dG / dS) : 0, dG, nS, nG, xS, xG, cS, cDG: cS ? Math.round(cG / cS) : 0, cG };
      });
      return { a, b, per, list, rows, T };
    }

    function computePartnerSummary(kind, C, useFilter = false) {
      const A = kind === "kh" ? KH : NCC, pre = kind === "kh" ? "131" : "331", ps = new Map();
      const per = useFilter ? (kind === "kh" ? khPer : nccPer) : { t: "Tất cả", k: 1, y: C.Y };
      const q = useFilter ? (kind === "kh" ? khQ : nccQ).trim().toLowerCase() : "";
      const sortObj = useFilter ? (kind === "kh" ? khSort : nccSort) : { k: "", d: 1 };
      A.forEach(a => ps.set(a.ma, { ...a, n: 0, c: 0, inList: true }));
      nkG(C).concat(NKX.map(x => ({ l: x, s: x.tien }))).forEach(({ l, s }) => {
        if (!matchesPer(l.ngay, per)) return;
        const d = String(l.no).startsWith(pre), c = String(l.co).startsWith(pre);
        if (!l.kh || (!d && !c)) return;
        if (!ps.has(l.kh)) ps.set(l.kh, { ma: l.kh, ten: "(chưa có trong danh mục)", mst: "", dau: 0, n: 0, c: 0, inList: false });
        const o = ps.get(l.kh); if (d) o.n += Math.round(s); if (c) o.c += Math.round(s);
      });
      const T = [0, 0, 0, 0];
      let rows = [...ps.values()].map(o => ({ ...o, cu: kind === "kh" ? o.dau + o.n - o.c : o.dau + o.c - o.n }));
      if (q) rows = rows.filter(o => (o.ma + " " + o.ten + " " + o.mst).toLowerCase().includes(q));
      if (sortObj.k) {
        const k = sortObj.k, d = sortObj.d;
        rows.sort((a, b) => (k === "dau" || k === "n" || k === "c" || k === "cu") ? ((a[k] - b[k]) * d) : String(a[k] ?? "").localeCompare(String(b[k] ?? ""), "vi") * d);
      }
      rows.forEach(o => { T[0] += o.dau; T[1] += o.n; T[2] += o.c; T[3] += o.cu; });
      return { rows, T };
    }

    function buildDmAoa(Y) {
      let tSL = 0, tGT = 0;
      const list = getFilteredDm();
      const body = list.map(p => {
        tSL += p.sl || 0; tGT += Math.round(p.gt || 0);
        return [p.ma, p.ten, p.dvt, p.sl || 0, p.sl ? Math.round(p.gt / p.sl) : 0, Math.round(p.gt || 0)];
      });
      return [
        ["DANH MỤC HÀNG HÓA - TỒN ĐẦU NĂM", "", "", "", "", `Năm ${Y}`], [],
        ["Mã hàng", "Tên hàng hóa", "ĐVT", "Tồn đầu SL", "Đơn giá", "Tồn đầu GT"],
        ...body,
        ["", `TỔNG CỘNG (${list.length} mã)`, "", tSL, "", tGT]
      ];
    }

    function buildTkAoa(isVpdd, C, prodsSrc, linesSrc) {
      const d = computeTkSummary(isVpdd, C, prodsSrc, linesSrc, isVpdd ? tkVpQ : tkQ);
      const lbl = d.per.t === "Năm" ? `Năm ${C.Y}` : `${d.per.t} ${d.per.k}/${C.Y}`;
      return [
        [isVpdd ? `TỔNG HỢP TỒN KHO VPĐD (TK 1368) - ${lbl}` : `TỔNG HỢP NHẬP - XUẤT - TỒN KHO - ${lbl}`], [],
        ["Mã hàng", "Tên hàng hóa", "ĐVT", "Đầu SL", "Đầu ĐG", "Đầu GT", "Nhập SL", "Nhập GT", "Xuất SL", "Xuất GT", "Cuối SL", "Cuối ĐG", "Cuối GT"],
        ...d.rows.map(r => [r.ma, r.ten, r.dvt, r.dS, r.dDG, r.dG, r.nS, r.nG, r.xS, r.xG, r.cS, r.cDG, r.cG]),
        ["", `TỔNG CỘNG (${d.rows.length} mã)`, "", d.T.dS, "", d.T.dG, d.T.nS, d.T.nG, d.T.xS, d.T.xG, d.T.cS, "", d.T.cG]
      ];
    }

    function buildCtAoa(isVpdd, C, linesSrc, prodsSrc) {
      const ls = getFilteredCt(isVpdd, C, linesSrc);
      let sSN = 0, sGN = 0, sSX = 0, sGX = 0;
      const body = ls.map(l => {
        const p = prodsSrc.find(x => x.ma === l.ma) || {};
        sSN += l.sn || 0; sGN += l.gtn || 0; sSX += l.sx || 0; sGX += l.gx || 0;
        return [
          ...(isVpdd ? [l._auto ? "Copy 1368/156" : "Import VPĐD"] : []),
          l.ph, dr(l.ngay), l.hd, l.kh, l.no, l.co, l.nd, l.ma, p.ten || "", p.dvt || "",
          l.sn ?? "", l.gn ?? "", l.gtn ?? "", l.sx ?? "", l.px ?? "", l.gx != null ? l.gx : "", l._err || ""
        ];
      });
      return [
        [isVpdd ? `XUẤT NHẬP KHO VPĐD (TK 1368) - NĂM ${C.Y}` : `XUẤT NHẬP KHO CÔNG TY - NĂM ${C.Y}`], [],
        [...(isVpdd ? ["Nguồn"] : []), "Mã phiếu", "Ngày", "Số HĐ", "KH/NCC", "TK Nợ", "TK Có", "Nội dung", "Mã hàng", "Tên hàng", "ĐVT", "Nhập SL", "Nhập ĐG", "Nhập GT", "Xuất SL", "Xuất ĐG", "Xuất GT", "Kiểm tra"],
        ...body,
        [...(isVpdd ? [""] : []), "", "", "", "", "", "", `CỘNG (${ls.length} dòng)`, "", "", "", sSN, "", sGN, sSX, "", sGX, ""]
      ];
    }

    function buildNkAoa(C, filtered = false) {
      const R = filtered ? getFilteredNk(C) : buildNkRows(C);
      const tot = R.reduce((a, r) => a + Math.round(r.s || 0), 0);
      return [
        [`NHẬT KÝ CHUNG - NĂM ${C.Y}`], [],
        ["Ngày", "Mã phiếu", "Số HĐ", "Nội dung", "TK Nợ", "TK Có", "Số tiền", "Mã KH/NCC", "Ghi chú"],
        ...R.map(r => [r.ngay ? dr(r.ngay) : "", r.ph, r.hd, r.nd, r.no, r.co, r.s, r.kh, r.gc || ""]),
        ["", "", "", `TỔNG PHÁT SINH (${R.length} dòng)`, "", "", tot, "", ""]
      ];
    }

    function buildPartnerAoa(kind, C, filtered = false) {
      const isKh = kind === "kh", d = computePartnerSummary(kind, C, filtered);
      return [
        [isKh ? `CÔNG NỢ PHẢI THU KHÁCH HÀNG - NĂM ${C.Y}` : `CÔNG NỢ PHẢI TRẢ NHÀ CUNG CẤP - NĂM ${C.Y}`], [],
        [isKh ? "Mã KH" : "Mã NCC", isKh ? "Thông tin khách hàng" : "Thông tin nhà cung cấp", "MST", "Đầu kỳ", "Phát sinh Nợ", "Phát sinh Có", "Cuối kỳ"],
        ...d.rows.map(o => [o.ma, o.ten, o.mst, o.dau, o.n, o.c, o.cu]),
        ["", `TỔNG CỘNG (${d.rows.length})`, "", d.T[0], d.T[1], d.T[2], d.T[3]]
      ];

    function buildSoCaiContext(C) {
      const nkRows = buildNkRows(C);
      const cat = cdspsCir === "TT99" ? ACCOUNTS_TT99 : ACCOUNTS_TT200;
      const nameMap = new Map(cat);
      const setTks = new Set(cat.map(x => x[0]));
      tkOpening.forEach(o => { if (o.tk) { setTks.add(o.tk.trim()); if (o.ten && !nameMap.has(o.tk)) nameMap.set(o.tk, o.ten); } });
      nkRows.forEach(r => { if (r.no) setTks.add(r.no.trim()); if (r.co) setTks.add(r.co.trim()); });
      const sortedTks = [...setTks].sort((a, b) => a.localeCompare(b, "en"));
      const activeTk = selTk || sortedTks[0] || "156";
      const match = acc => { const c = String(acc || "").trim(); return c && (soCaiSub ? c.startsWith(activeTk) : c === activeTk); };
      const [a, b] = rangeOf(soCaiPer);
      let opNo = 0, opCo = 0, prNo = 0, prCo = 0, ytdNo = 0, ytdCo = 0;
      tkOpening.forEach(o => { if (match(o.tk)) { opNo += Math.round(o.no || 0); opCo += Math.round(o.co || 0); } });
      const sortedYearNk = nkRows
        .filter(r => r.ngay && r.ngay.length >= 7 && +r.ngay.slice(0, 4) === C.Y)
        .sort((x, y) => x.ngay < y.ngay ? -1 : x.ngay > y.ngay ? 1 : String(x.ph || "").localeCompare(String(y.ph || "")));
      const entries = [];
      let totNo = 0, totCo = 0;
      sortedYearNk.forEach((r, idx) => {
        const rm = +r.ngay.slice(5, 7), amt = Math.round(r.s || 0);
        const d = match(r.no), c = match(r.co);
        if (!d && !c) return;
        const psNo = d ? amt : 0, psCo = c ? amt : 0;
        if (rm >= 1 && rm <= b) { ytdNo += psNo; ytdCo += psCo; }
        if (rm >= 1 && rm < a) { prNo += psNo; prCo += psCo; return; }
        if (rm >= a && rm <= b) {
          const doiUng = d && c ? `${r.co}/${r.no}` : d ? r.co : r.no;
          totNo += psNo; totCo += psCo;
          entries.push({
            ngay: r.ngay, ph: r.ph, nd: r.nd,
            trangNkc: Math.floor(idx / 40) + 1, sttNkc: idx + 1,
            doiUng, psNo, psCo
          });
        }
      });
      const netOp = opNo + prNo - (opCo + prCo);
      const startNo = netOp > 0 ? netOp : 0, startCo = netOp < 0 ? -netOp : 0;
      const netEnd = netOp + totNo - totCo;
      return {
        sortedTks, activeTk, tkName: nameMap.get(activeTk) || "", a, b,
        startNo, startCo, totNo, totCo, ytdNo, ytdCo,
        endNo: netEnd > 0 ? netEnd : 0, endCo: netEnd < 0 ? -netEnd : 0, entries
      };
    }

    function buildS38Context(C) {
      const nkRows = buildNkRows(C);
      const cat = cdspsCir === "TT99" ? ACCOUNTS_TT99 : ACCOUNTS_TT200;
      const nameMap = new Map(cat);
      const setTks = new Set(cat.map(x => x[0]));
      tkOpening.forEach(o => { if (o.tk) { setTks.add(o.tk.trim()); if (o.ten && !nameMap.has(o.tk)) nameMap.set(o.tk, o.ten); } });
      nkRows.forEach(r => { if (r.no) setTks.add(r.no.trim()); if (r.co) setTks.add(r.co.trim()); });
      const sortedTks = [...setTks].sort((a, b) => a.localeCompare(b, "en"));
      const activeTk = selTk || sortedTks[0] || "156";
      const match = acc => { const c = String(acc || "").trim(); return c && (s38Sub ? c.startsWith(activeTk) : c === activeTk); };
      const [a, b] = rangeOf(s38Per);
      let opNo = 0, opCo = 0, prNo = 0, prCo = 0;
      tkOpening.forEach(o => { if (match(o.tk)) { opNo += Math.round(o.no || 0); opCo += Math.round(o.co || 0); } });
      nkRows.forEach(r => {
        if (!r.ngay || r.ngay.length < 7 || +r.ngay.slice(0, 4) !== C.Y) return;
        const rm = +r.ngay.slice(5, 7), amt = Math.round(r.s || 0);
        if (rm >= 1 && rm < a) {
          if (match(r.no)) prNo += amt;
          if (match(r.co)) prCo += amt;
        }
      });
      const netOp = opNo + prNo - (opCo + prCo);
      const startNo = netOp > 0 ? netOp : 0, startCo = netOp < 0 ? -netOp : 0;
      let runNet = netOp, totNo = 0, totCo = 0;
      const entries = [];
      nkRows.forEach(r => {
        if (!r.ngay || r.ngay.length < 7 || +r.ngay.slice(0, 4) !== C.Y) return;
        const rm = +r.ngay.slice(5, 7);
        if (rm < a || rm > b) return;
        const d = match(r.no), c = match(r.co);
        if (!d && !c) return;
        const amt = Math.round(r.s || 0), psNo = d ? amt : 0, psCo = c ? amt : 0;
        const doiUng = d && c ? `${r.co}/${r.no}` : d ? r.co : r.no;
        totNo += psNo; totCo += psCo;
        runNet = runNet + psNo - psCo;
        entries.push({ ngay: r.ngay, ph: r.ph, nd: r.nd, doiUng, psNo, psCo, duNo: runNet > 0 ? runNet : 0, duCo: runNet < 0 ? -runNet : 0, gc: r.gc || "" });
      });
      return { sortedTks, activeTk, tkName: nameMap.get(activeTk) || "", a, b, startNo, startCo, totNo, totCo, endNo: runNet > 0 ? runNet : 0, endCo: runNet < 0 ? -runNet : 0, entries };
    }
