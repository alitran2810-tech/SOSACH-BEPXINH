    function getPartnerOpening(p, kind) {
      if (p.dauNo != null || p.dauCo != null) {

          dauCo: Math.round(Number(p.dauCo) || 0)

      if (kind === "kh") {
        return { dauNo: legacy > 0 ? legacy : 0, dauCo: legacy < 0 ? -legacy : 0 };
      }
      return { dauNo: legacy < 0 ? -legacy : 0, dauCo: legacy > 0 ? legacy : 0 };

    function toDate(v) {
      if (v instanceof Date && !isNaN(v.getTime())) return new Date(v.getTime() - v.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
      if (typeof v === "number") return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
      const m = String(v || "").trim().match(/^(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{4})$/);
      if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
      return String(v || "").slice(0, 10);
    }

    function importFile(f, kind) {
      const r = new FileReader();
      r.onload = e => {
        try {
          const wb = XLSX.read(e.target.result, { type: "array", cellDates: true });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          const eff = (kind === "tk" || kind === "tk_vpdd") ? "dm" : kind === "ct_vpdd" ? "ct" : kind;
          const spec = mk[eff];
          const map = {};
          if (rows.length) {
            Object.keys(rows[0]).forEach(h => {
              const n = norm(h);
              for (const k in spec) if (spec[k].includes(n) && !(k in map)) map[k] = h;
            });
          }
          const g = (r, k) => map[k] ? r[map[k]] : "";
          const num = v => v === "" ? null : Number(String(v).replace(/,/g, ""));
          const cols = Object.keys(map).join(", ") || "không có - kiểm tra tiêu đề cột";

          if (kind === "dm" || kind === "tk") {
            P.length = 0;
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim();
              if (ma) {
                const sl = num(g(r, "sl")) || 0, dg = Math.round(num(g(r, "dg")) || 0);
                P.push({ ma, ten: String(g(r, "ten") ?? ""), dvt: String(g(r, "dvt") ?? ""), sl, gt: Math.round(num(g(r, "gt")) ?? sl * dg) });
              }
            });
            markDirty("all");
          } else if (kind === "tk_vpdd") {
            for (const k in vpddOpening) delete vpddOpening[k];
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim();
              if (ma) {
                const sl = num(g(r, "sl")) || 0, dg = Math.round(num(g(r, "dg")) || 0);
                vpddOpening[ma] = { sl, gt: Math.round(num(g(r, "gt")) ?? sl * dg) };
              }
            });
            markDirty("vp");
          } else if (kind === "cdsps") {
            tkOpening.length = 0;
            rows.forEach(r => {
              const tk = String(g(r, "tk")).trim();
              if (tk) tkOpening.push({ tk, ten: String(g(r, "ten") ?? "").trim(), no: Math.round(num(g(r, "no")) || 0), co: Math.round(num(g(r, "co")) || 0) });
            });
          } else if (kind === "nk") {
            NKX.length = 0;
            rows.forEach(r => {
              const ph = String(g(r, "ph")).trim(), t = num(g(r, "tien"));
              if (ph || t) NKX.push({
                ngay: toDate(g(r, "ngay")), ph, hd: String(g(r, "hd")),
                nd: String(g(r, "nd")), no: String(g(r, "no")), co: String(g(r, "co")),
                tien: Math.round(t || 0), kh: String(g(r, "kh")), gc: String(g(r, "gc") ?? "")
              });
            });
            markDirty("nk");
          } else if (kind === "kh" || kind === "ncc") {
            const A = kind === "kh" ? KH : NCC;
            A.length = 0;
            const hasSplitCols = map.dauNo != null || map.dauCo != null;
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim();
              if (ma) {
                const rawNo = num(g(r, "dauNo"));
                const rawCo = num(g(r, "dauCo"));
                const rawLegacy = num(g(r, "dau"));
                const op = hasSplitCols
                  ? { dauNo: Math.round(rawNo || 0), dauCo: Math.round(rawCo || 0) }
                  : getPartnerOpening({ dau: Math.round(rawLegacy || 0) }, kind);
                A.push({
                  ma,
                  ten: String(g(r, "ten") ?? "").trim(),
                  mst: String(g(r, "mst") ?? "").trim(),
                  dauNo: op.dauNo,
                  dauCo: op.dauCo,
                  dau: kind === "kh" ? op.dauNo - op.dauCo : op.dauCo - op.dauNo
                });
              }
            });
          } else {
            const isVpdd = kind === "ct_vpdd";
            const targetArr = isVpdd ? LnVPDD : Ln;
            const incoming = [];
            rows.forEach(r => {
              const ma = String(g(r, "ma")).trim(), ph = String(g(r, "ph")).trim();
              if (ma || ph) {
                const gn = num(g(r, "gn")), gi = num(g(r, "gi"));
                incoming.push({
                  id: uid(), ph, ngay: toDate(g(r, "ngay")), hd: String(g(r, "hd")), kh: String(g(r, "kh")),
                  no: String(g(r, "no")), co: String(g(r, "co")), nd: String(g(r, "nd")),
                  ma, sn: num(g(r, "sn")), gn: gn != null ? Math.round(gn) : null,
                  sx: num(g(r, "sx")), gi: gi != null ? Math.round(gi) : null
                });
              }
            });
            if (targetArr.length > 0) {
              const existSet = new Set(targetArr.map(l => l.ngay ? l.ngay.slice(0, 7) : "").filter(Boolean));
              const overlap = [...new Set(incoming.map(l => l.ngay ? l.ngay.slice(0, 7) : "").filter(ym => ym && existSet.has(ym)))].sort();
              if (overlap.length > 0) {
                showDuplicateModal(targetArr, incoming, overlap, cols, isVpdd);
                return;
              }
              targetArr.push(...incoming);
              if (incoming[0]?.ngay) { $("#yr").value = incoming[0].ngay.slice(0, 4); ctPer.y = vpddPer.y = +$("#yr").value; }
              st(`Đã ghi thêm ${incoming.length} dòng kỳ mới. Cột nhận diện: ${cols}`);
              markDirty(isVpdd ? "vp" : "all");
              saveLocal(); render(); return;
            }
            targetArr.length = 0; targetArr.push(...incoming);
            if (targetArr[0]?.ngay) { $("#yr").value = targetArr[0].ngay.slice(0, 4); ctPer.y = vpddPer.y = +$("#yr").value; }
            markDirty(isVpdd ? "vp" : "all");
          }
          st(`Đã đọc ${rows.length} dòng. Cột nhận diện: ${cols}`);
          saveLocal(); render();
        } catch (x) {
          st("Lỗi đọc file: " + x.message, 1); render();
        }
      };
      r.readAsArrayBuffer(f);
    }

    function calcSet(products, lines) {
      const Y = +$("#yr").value, U = +$("#up").value;
      const pm = new Map(), M = {}, first = {}, errs = new Map(), retWarns = new Map();
      const buckets = new Map();
      for (let i = 0; i < products.length; i++) {
        const p = products[i];
        pm.set(p.ma, p);
        M[p.ma] = {};
      }
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        const m = (l.ngay && +l.ngay.slice(0, 4) === Y) ? +l.ngay.slice(5, 7) : 0;
        l._m = m;
        l.gn = l.gn != null ? Math.round(l.gn) : null;
        l.gtn = l.sn != null ? Math.round(l.sn * (l.gn || 0)) : null;
        l.px = null;
        l.gx = null;
        l._isRet = l.sx != null && l.sx < 0;
        l._retWarn = (l._isRet && l.gi == null) ? "Yêu cầu nhập giá cho hàng hóa khách hàng trả lại" : "";
        let e = "";
        if (!l.ph) e = "Thiếu mã phiếu";
        else if (!l.ngay) e = "Thiếu ngày";
        else if (first[l.ph] && first[l.ph].ngay !== l.ngay) e = `Mã phiếu bị trùng, đã có ở ngày ${dr(first[l.ph].ngay)} - vui lòng kiểm tra lại`;
        else if (!pm.has(l.ma)) e = "Mã hàng chưa có trong danh mục";
        if (l.ph && !first[l.ph]) first[l.ph] = l;
        if (e) errs.set(l, e);
        if (l._retWarn) retWarns.set(l, l._retWarn);
        if (m >= 1 && m <= U && pm.has(l.ma)) {
          let mm = buckets.get(l.ma);
          if (!mm) { mm = new Map(); buckets.set(l.ma, mm); }
          let arr = mm.get(m);
          if (!arr) { arr = []; mm.set(m, arr); }
          arr.push(l);
        }
      }
      for (let pi = 0; pi < products.length; pi++) {
        const p = products[pi];
        let s = p.sl, g = Math.round(p.gt);
        const mm = buckets.get(p.ma);
        for (let m = 1; m <= U; m++) {
          const ls = mm ? (mm.get(m) || []) : [];
          if (ls.length > 1) ls.sort((a, b) => a.ngay < b.ngay ? -1 : a.ngay > b.ngay ? 1 : 0);
          let nS = 0, nG = 0, posXS = 0, retS = 0, retG = 0;
          const exps = [];
          for (let j = 0; j < ls.length; j++) {
            const l = ls[j];
            nS += l.sn || 0;
            nG += l.gtn || 0;
            const sxVal = l.sx || 0;
            if (sxVal < 0) {
              if (l.gi != null) {
                const pxVal = Math.round(l.gi);
                l.px = pxVal;
                l.gx = Math.round(sxVal * pxVal);
                retG += l.gx;
              } else {
                l.px = null;
                l.gx = null;
              }
              retS += sxVal;
            } else if (sxVal > 0) {
              posXS += sxVal;
              exps.push(l);
            }
          }
          const availS = s + nS - retS;
          const availG = Math.round(g + nG - retG);
          const pr = availS > 0 && availG > 0 ? Math.round(availG / availS) : 0;
          const endS = availS - posXS;
          let cumPosGx = 0;
          for (let idx = 0; idx < exps.length; idx++) {
            const l = exps[idx], qty = l.sx || 0;
            if (endS >= 0) {
              const remG = Math.max(0, availG - cumPosGx);
              if (idx === exps.length - 1 && endS === 0) {
                l.gx = remG;
                l.px = qty > 0 ? Math.round(l.gx / qty) : 0;
              } else {
                const unitP = l.gi != null ? Math.round(l.gi) : pr;
                l.gx = Math.min(remG, Math.max(0, Math.round(qty * unitP)));
                l.px = unitP;
              }
            } else {
              const unitP = l.gi != null ? Math.round(l.gi) : pr;
              l.px = unitP;
              l.gx = Math.round(qty * unitP);
            }
            cumPosGx += l.gx || 0;
          }
          const xS = retS + posXS;
          const xG = retG + cumPosGx;
          M[p.ma][m] = { dS: s, dG: g, nS, nG, xS, xG, pr };
          s = s + nS - xS;
          g = s === 0 ? 0 : Math.round(g + nG - xG);
        }
      }
      return { M, pm, errs, retWarns, Y, U };
    }

    function getVpddProducts() {
      return P.map(p => ({ ma: p.ma, ten: p.ten, dvt: p.dvt, sl: vpddOpening[p.ma]?.sl || 0, gt: Math.round(vpddOpening[p.ma]?.gt || 0) }));
    }

    function getVpddLines() {
      const autoIn = Ln.filter(isBranch1368).map(l => ({
        ph: l.ph, ngay: l.ngay, hd: l.hd, kh: l.kh,
        no: "1368", co: "156", nd: l.nd || "Nhập kho VPĐD từ Công ty (Nợ 1368 / Có 156)",
        ma: l.ma, sn: l.sx, gn: l.px != null ? Math.round(l.px) : (l.gx != null && l.sx ? Math.round(l.gx / l.sx) : 0),
        sx: null, gi: null, _auto: 1
      }));
      return autoIn.concat(LnVPDD.map(l => { l._auto = 0; return l; }));
    }

    function getC() {
      if (_dirtyC || !_cacheC) {
        _cacheC = calcSet(P, Ln);

      else if (a <= C.U && pm[a]) { s = pm[a].dS; g = pm[a].dG; }
      else if (pm[C.U]) { const z = pm[C.U]; s = z.dS + z.nS - z.xS; g = s === 0 ? 0 : Math.round(z.dG + z.nG - z.xG); }

      return `<div class="pb sc"><div style="display:flex;justify-content:space-between;gap:20px"><div><b>Đơn vị: ${esc(CFG.ten)}</b><br>Địa chỉ: ${esc(CFG.dc)}</div><div style="max-width:320px;font-size:12px"><b>Mẫu số S10-DN</b><br><i>(Kèm theo Thông tư số 99/2025/TT-BTC ngày 27 tháng 10 năm 2025 của Bộ trưởng Bộ Tài chính)</i></div></div><h3 style="text-align:center;margin:10px 0 2px">SỔ CHI TIẾT SẢN PHẨM, HÀNG HOÁ</h3><div style="text-align:center"><i>${perTitle}</i><br><b>Tài khoản: ${esc(tkOv || CFG.tk)} &nbsp; Tên kho: ${esc(khoOv || CFG.kho)}</b></div><p>Mã hàng hóa: <b>${esc(p.ma)}</b><br>Tên hàng hóa: <b>${esc(p.ten)}</b> (${esc(p.dvt)})<br><i>Đơn vị tính: vnđ</i></p><div style="overflow-x:auto"><table>${hd}<tbody>${R}</tbody></table></div><p>- Sổ này có ... trang, đánh số từ trang 01 đến trang ...<br>- Ngày mở sổ: 01/${String(a).padStart(2, "0")}/${C.Y}</p><div class="sg">${sg("Người ghi sổ", CFG.ghi)}${sg("Kế toán trưởng", CFG.kt)}<span><i>Ngày..... tháng.... năm ${C.Y}</i><br><b>Người đại diện theo pháp luật</b><br><i>(Ký, họ tên, đóng dấu)</i><br><br><br>${esc(CFG.dd)}</span></div></div>`;

    function applySort(arr, sortObj, errTop, pm) {
      const k = sortObj.k, d = sortObj.d;
      const numK = new Set(["sn", "gn", "gtn", "sx", "px", "gx"]);
      const getPrio = x => x._retWarn ? 2 : (errTop && x._err ? 1 : 0);
      return [...arr].sort((a, b) => {
        const pa = getPrio(a), pb = getPrio(b);
        if (pa !== pb) return pb - pa;
        if (!k) return 0;
        if (numK.has(k)) return ((a[k] ?? -Infinity) - (b[k] ?? -Infinity)) * d;
        let av = "", bv = "";
        if (k === "ten") { av = (pm.get(a.ma) || {}).ten || ""; bv = (pm.get(b.ma) || {}).ten || ""; }
        else if (k === "dvt") { av = (pm.get(a.ma) || {}).dvt || ""; bv = (pm.get(b.ma) || {}).dvt || ""; }
        else if (k === "err") { av = [a._err, a._retWarn].filter(Boolean).join("; "); bv = [b._err, b._retWarn].filter(Boolean).join("; "); }
        else { av = String(a[k] ?? ""); bv = String(b[k] ?? ""); }
        return av.localeCompare(bv, "vi") * d;
      });
    }

    function buildNkRows(C) {
      if (!_dirtyNk && _cacheNk) return _cacheNk;
      const auto = nkG(C).map(({ l, s }) => {
        const key = `kho|${l.ph}|${l.kh}|${l.ngay}`;
        return {
          key, ngay: l.ngay, ph: l.ph, hd: l.hd, nd: l.nd, no: l.no, co: l.co, s: Math.round(s), kh: l.kh,
          gc: (key in nkNotes) ? nkNotes[key] : (isBranch1368(l) ? "Điều chuyển kho VPĐD (1368)" : ""),
          src: "kho", idx: -1
        };
      });
      const imp = NKX.map((x, idx) => ({
        key: `imp|${idx}|${x.ph}|${x.ngay}`, ngay: x.ngay, ph: x.ph, hd: x.hd, nd: x.nd, no: x.no, co: x.co,
        s: Math.round(x.tien || 0), kh: x.kh, gc: x.gc || "", src: "imp", idx
      }));
      _cacheNk = auto.concat(imp).sort((a, b) => a.ngay < b.ngay ? -1 : a.ngay > b.ngay ? 1 : 0);
      _dirtyNk = false;
      return _cacheNk;
    }

    function buildCdsps(cir, nkRows, Y, per) {
      const [a, b] = rangeOf(per);
      const cat = cir === "TT99" ? ACCOUNTS_TT99 : ACCOUNTS_TT200;
      const nameMap = new Map(cat);
      const openMap = new Map();
      const setAll = new Set(cat.map(x => x[0]));
      tkOpening.forEach(o => {
        const tk = String(o.tk || "").trim();
        if (!tk) return;
        setAll.add(tk);
        if (o.ten && !nameMap.has(tk)) nameMap.set(tk, o.ten);
        const cur = openMap.get(tk) || { no: 0, co: 0 };
        openMap.set(tk, { no: cur.no + Math.round(o.no || 0), co: cur.co + Math.round(o.co || 0) });
      });
      const prN = new Map(), prC = new Map(), pN = new Map(), pC = new Map();
      nkRows.forEach(r => {
        const no = String(r.no || "").trim(), co = String(r.co || "").trim();
        if (no) setAll.add(no);
        if (co) setAll.add(co);
        if (!r.ngay || r.ngay.length < 7) return;
        const ry = +r.ngay.slice(0, 4), rm = +r.ngay.slice(5, 7);
        if (ry !== Y) return;
        const amt = Math.round(r.s || 0);
        if (rm >= 1 && rm < a) {
          if (no) prN.set(no, (prN.get(no) || 0) + amt);
          if (co) prC.set(co, (prC.get(co) || 0) + amt);
        } else if (rm >= a && rm <= b) {
          if (no) pN.set(no, (pN.get(no) || 0) + amt);
          if (co) pC.set(co, (pC.get(co) || 0) + amt);
        }
      });
      const tot = { dNo: 0, dCo: 0, pNo: 0, pCo: 0, cNo: 0, cCo: 0 };
      const rows = [...setAll].sort((x, y) => x.localeCompare(y, "en")).map(tk => {
        const op = openMap.get(tk) || { no: 0, co: 0 };
        const netOp = op.no + (prN.get(tk) || 0) - (op.co + (prC.get(tk) || 0));
        const dNo = netOp > 0 ? netOp : 0, dCo = netOp < 0 ? -netOp : 0;
        const psNo = pN.get(tk) || 0, psCo = pC.get(tk) || 0;
        const netEnd = dNo + psNo - (dCo + psCo);
        const cNo = netEnd > 0 ? netEnd : 0, cCo = netEnd < 0 ? -netEnd : 0;
        tot.dNo += dNo; tot.dCo += dCo; tot.pNo += psNo; tot.pCo += psCo; tot.cNo += cNo; tot.cCo += cCo;
        return {
          tk, ten: nameMap.get(tk) || "(Tài khoản chi tiết)", dNo, dCo, pNo: psNo, pCo: psCo, cNo, cCo,
          hasAny: dNo !== 0 || dCo !== 0 || psNo !== 0 || psCo !== 0 || cNo !== 0 || cCo !== 0,
          hasPer: psNo !== 0 || psCo !== 0
        };
      });
      return { rows, tot };
    }

    function buildCdspsAoa(rows, tot, cir, Y, per) {
      const act = rows.filter(r => r.hasAny);
      const perLbl = per.t === "Năm" ? `Năm ${Y}` : per.t === "Quý" ? `Quý ${per.k}/${Y}` : `Tháng ${String(per.k).padStart(2, "0")}/${Y}`;
      return [
        [`BẢNG CÂN ĐỐI SỐ PHÁT SINH (${cir === "TT99" ? "Thông tư 99/2025/TT-BTC" : "Thông tư 200/2014/TT-BTC"})`],
        [perLbl], [],
        ["Số hiệu TK", "Tên tài khoản", "Dư Nợ đầu kỳ", "Dư Có đầu kỳ", "PS Nợ", "PS Có", "Dư Nợ cuối kỳ", "Dư Có cuối kỳ"],
        ...act.map(r => [r.tk, r.ten, r.dNo, r.dCo, r.pNo, r.pCo, r.cNo, r.cCo]),
        ["", "TỔNG CỘNG", tot.dNo, tot.dCo, tot.pNo, tot.pCo, tot.cNo, tot.cCo]
      ];
    }

    function getFilteredDm() {
      const q = dmQ.trim().toLowerCase();
      let actSet = null;
      if (dmPer.t !== "Tất cả") {
        actSet = new Set();
        Ln.forEach(l => { if (matchesPer(l.ngay, dmPer) && l.ma) actSet.add(l.ma); });
        LnVPDD.forEach(l => { if (matchesPer(l.ngay, dmPer) && l.ma) actSet.add(l.ma); });
      }
      const list = P.filter(p => {
        if (actSet && !actSet.has(p.ma)) return false;
        if (q && !(p.ma + " " + p.ten + " " + p.dvt).toLowerCase().includes(q)) return false;
        return true;
      });
      if (!dmSort.k) return list;
      const k = dmSort.k, d = dmSort.d;
      return [...list].sort((a, b) => {
        if (k === "sl" || k === "gt" || k === "dg") {
          const av = k === "sl" ? (a.sl || 0) : k === "gt" ? Math.round(a.gt || 0) : (a.sl ? Math.round(a.gt / a.sl) : 0);
          const bv = k === "sl" ? (b.sl || 0) : k === "gt" ? Math.round(b.gt || 0) : (b.sl ? Math.round(b.gt / b.sl) : 0);
          return (av - bv) * d;
        }
        return String(a[k] ?? "").localeCompare(String(b[k] ?? ""), "vi") * d;
      });
    }

    function getFilteredNk(C) {
      const q = nkQ.trim().toLowerCase();
      return buildNkRows(C).filter(r => {
        if (!matchesPer(r.ngay, nkPer)) return false;
        if (q && !(r.ph + " " + r.hd + " " + r.nd + " " + r.no + " " + r.co + " " + r.kh + " " + r.gc).toLowerCase().includes(q)) return false;

      });

    function getFilteredCt(isVpdd, C, linesSrc) {
      const qVal = isVpdd ? vpddQ : ctQ, per = isVpdd ? vpddPer : ctPer, sortObj = isVpdd ? vpddSort : ctSort;

      });

          if (coRaw) l.co = coRaw;
          if (ndRaw) l.nd = ndRaw;
        });
        $("#mdl").innerHTML = "";
        markDirty(isVpdd ? "vp" : "all");
        pendingRetRecalc = false;
        st(`Đã cập nhật hàng loạt ${targets.length} dòng và tính lại giá vốn.`);
        saveLocal(); render();
      };
    }

    function computeTkSummary(isVpdd, C, prodsSrc, linesSrc, qStr = "", negFirst = true, onlyNeg = false) {
      const per = isVpdd ? ktVpdd : kt;
      const [a, b] = rangeOf(per);
      const actCodes = new Set(linesSrc.map(l => l.ma));
      const q = qStr.trim().toLowerCase();
      const list = prodsSrc.filter(p => {
        if (isVpdd && !vpddShowAll && !(p.sl > 0 || p.gt > 0 || actCodes.has(p.ma))) return false;
        if (q && !(p.ma + " " + p.ten + " " + p.dvt).toLowerCase().includes(q)) return false;
        return true;
      });
      const T = { dS: 0, dG: 0, nS: 0, nG: 0, xS: 0, xG: 0, cS: 0, cG: 0 };
      let negCount = 0;
      const allRows = list.map(p => {
        const m = C.M[p.ma] || {}, f = m[a];
        let dS = f ? f.dS : 0, dG = f ? f.dG : 0;
        if (!f && C.U === 0) { dS = p.sl; dG = Math.round(p.gt); }
        else if (!f && a > C.U && m[C.U]) { const z = m[C.U]; dS = z.dS + z.nS - z.xS; dG = dS === 0 ? 0 : Math.round(z.dG + z.nG - z.xG); }
        let nS = 0, nG = 0, xS = 0, xG = 0;
        for (let i = a; i <= b; i++) if (m[i]) { nS += m[i].nS; nG += m[i].nG; xS += m[i].xS; xG += m[i].xG; }
        const cS = dS + nS - xS, cG = cS === 0 ? 0 : Math.round(dG + nG - xG);
        const isNegative = cS < 0 || cG < 0;
        if (isNegative) negCount++;
        return { ma: p.ma, ten: p.ten, dvt: p.dvt, dS, dDG: dS ? Math.round(dG / dS) : 0, dG, nS, nG, xS, xG, cS, cDG: cS ? Math.round(cG / cS) : 0, cG, isNegative };
      });
      let rows = onlyNeg ? allRows.filter(r => r.isNegative) : allRows;
      if (negFirst && negCount > 0) {
        rows = rows.filter(r => r.isNegative).concat(rows.filter(r => !r.isNegative));
      }
      rows.forEach(r => { T.dS += r.dS; T.dG += r.dG; T.nS += r.nS; T.nG += r.nG; T.xS += r.xS; T.xG += r.xG; T.cS += r.cS; T.cG += r.cG; });
      return { a, b, per, list, rows, T, negCount };
    }

    function computePartnerSummary(kind, C, useFilter = false, customPer = null) {
      const A = kind === "kh" ? KH : NCC, pre = kind === "kh" ? "131" : "331", ps = new Map();
      const per = customPer || (useFilter ? (kind === "kh" ? khPer : nccPer) : { t: "Tất cả", k: 1, y: C.Y });
      const q = useFilter ? (kind === "kh" ? khQ : nccQ).trim().toLowerCase() : "";
      const sortObj = useFilter ? (kind === "kh" ? khSort : nccSort) : { k: "", d: 1 };
      A.forEach(a => {
        const op = getPartnerOpening(a, kind);
        ps.set(a.ma, { ma: a.ma, ten: a.ten, mst: a.mst, dauNoRaw: op.dauNo, dauCoRaw: op.dauCo, priorNo: 0, priorCo: 0, n: 0, c: 0, inList: true });
      });
      const [rangeStart, rangeEnd] = per.t === "Năm" ? [1, 12] : per.t === "Quý" ? [3 * per.k - 2, 3 * per.k] : per.t === "Tháng" ? [per.k, per.k] : [1, 12];
      nkG(C).concat(NKX.map(x => ({ l: x, s: x.tien }))).forEach(({ l, s }) => {
        const d = String(l.no || "").startsWith(pre), c = String(l.co || "").startsWith(pre);
        if (!l.kh || (!d && !c)) return;
        let o = ps.get(l.kh);
        if (!o) {
          o = { ma: l.kh, ten: "(chưa có trong danh mục)", mst: "", dauNoRaw: 0, dauCoRaw: 0, priorNo: 0, priorCo: 0, n: 0, c: 0, inList: false };
          ps.set(l.kh, o);
        }
        const amt = Math.round(s || 0);
        if (per.t === "Tất cả") {
          if (d) o.n += amt; if (c) o.c += amt;
          return;
        }
        const info = mqyInfo(l.ngay);
        if (!info || info.y !== (per.y || C.Y)) return;
        if (info.m < rangeStart) {
          if (d) o.priorNo += amt; if (c) o.priorCo += amt;
        } else if (info.m <= rangeEnd) {
          if (d) o.n += amt; if (c) o.c += amt;
        }
      });
      const T = { dauNo: 0, dauCo: 0, n: 0, c: 0, cuNo: 0, cuCo: 0 };
      let rows = [...ps.values()];
      if (q) rows = rows.filter(o => (o.ma + " " + o.ten + " " + o.mst).toLowerCase().includes(q));
      rows = rows.map(o => {
        let dauNo = o.dauNoRaw, dauCo = o.dauCoRaw;
        if (per.t !== "Tất cả" && rangeStart > 1) {
          const netOp = o.dauNoRaw - o.dauCoRaw + o.priorNo - o.priorCo;
          dauNo = netOp > 0 ? netOp : 0; dauCo = netOp < 0 ? -netOp : 0;
        }
        const netEnd = dauNo - dauCo + o.n - o.c;
        const cuNo = netEnd > 0 ? netEnd : 0, cuCo = netEnd < 0 ? -netEnd : 0;
        T.dauNo += dauNo; T.dauCo += dauCo; T.n += o.n; T.c += o.c; T.cuNo += cuNo; T.cuCo += cuCo;
        return { ma: o.ma, ten: o.ten, mst: o.mst, dauNo, dauCo, n: o.n, c: o.c, cuNo, cuCo, inList: o.inList };
      });
      if (sortObj.k) {
        const k = sortObj.k, d = sortObj.d;
        rows.sort((a, b) => (k === "dauNo" || k === "dauCo" || k === "n" || k === "c" || k === "cuNo" || k === "cuCo") ? ((a[k] - b[k]) * d) : String(a[k] ?? "").localeCompare(String(b[k] ?? ""), "vi") * d);
      }
      return { rows, T };
    }

    function computeCdspsReconcile(C, cdspsRows, per) {
      const p = { ...per, y: C.Y };
      const khRes = computePartnerSummary("kh", C, false, p);
      const nccRes = computePartnerSummary("ncc", C, false, p);
      let c131DNo = 0, c131DCo = 0, c131PNo = 0, c131PCo = 0, c131CNo = 0, c131CCo = 0;
      let c331DNo = 0, c331DCo = 0, c331PNo = 0, c331PCo = 0, c331CNo = 0, c331CCo = 0;
      cdspsRows.forEach(r => {
        if (r.tk.startsWith("131")) {
          c131DNo += r.dNo; c131DCo += r.dCo; c131PNo += r.pNo; c131PCo += r.pCo; c131CNo += r.cNo; c131CCo += r.cCo;
        } else if (r.tk.startsWith("331")) {
          c331DNo += r.dNo; c331DCo += r.dCo; c331PNo += r.pNo; c331PCo += r.pCo; c331CNo += r.cNo; c331CCo += r.cCo;
        }
      });
      const cdsps131OpenNet = c131DNo - c131DCo, cdsps131EndNet = c131CNo - c131CCo;
      const khOpenNet = khRes.T.dauNo - khRes.T.dauCo, khEndNet = khRes.T.cuNo - khRes.T.cuCo;
      const khOpenDiff = cdsps131OpenNet - khOpenNet, khEndDiff = cdsps131EndNet - khEndNet;
      const khPNoDiff = c131PNo - khRes.T.n, khPCoDiff = c131PCo - khRes.T.c;
      const has131Mismatch = khOpenDiff !== 0 || khEndDiff !== 0 || khPNoDiff !== 0 || khPCoDiff !== 0;

      const cdsps331OpenNet = c331DCo - c331DNo, cdsps331EndNet = c331CCo - c331CNo;
      const nccOpenNet = nccRes.T.dauCo - nccRes.T.dauNo, nccEndNet = nccRes.T.cuCo - nccRes.T.cuNo;
      const nccOpenDiff = cdsps331OpenNet - nccOpenNet, nccEndDiff = cdsps331EndNet - nccEndNet;
      const nccPNoDiff = c331PNo - nccRes.T.n, nccPCoDiff = c331PCo - nccRes.T.c;
      const has331Mismatch = nccOpenDiff !== 0 || nccEndDiff !== 0 || nccPNoDiff !== 0 || nccPCoDiff !== 0;

      return {
        hasError: has131Mismatch || has331Mismatch,
        errorCount: (has131Mismatch ? 1 : 0) + (has331Mismatch ? 1 : 0),
        ar131: { hasMismatch: has131Mismatch, cdspsOpenNet: cdsps131OpenNet, cdspsEndNet: cdsps131EndNet, khOpenNet, khEndNet, openDiff: khOpenDiff, endDiff: khEndDiff, pNoDiff: khPNoDiff, pCoDiff: khPCoDiff },
        ap331: { hasMismatch: has331Mismatch, cdspsOpenNet: cdsps331OpenNet, cdspsEndNet: cdsps331EndNet, nccOpenNet, nccEndNet, openDiff: nccOpenDiff, endDiff: nccEndDiff, pNoDiff: nccPNoDiff, pCoDiff: nccPCoDiff }
      };
    }

        ...d.rows.map(r => [r.ma, r.ten, r.dvt, r.dS, r.dDG, r.dG, r.nS, r.nG, r.xS, r.xG, r.cS, r.cDG, r.cG]),

    function buildCtAoa(isVpdd, C, linesSrc, prodsSrc) {
      const ls = getFilteredCt(isVpdd, C, linesSrc);

      return [

        ["Mã phiếu", "Ngày", "Số HĐ", "KH/NCC", "TK Nợ", "TK Có", "Nội dung", "Mã hàng", "Tên hàng", "ĐVT", "Nhập SL", "Nhập ĐG", "Nhập GT", "Xuất SL", "Xuất ĐG", "Xuất GT", "Kiểm tra"],

    function splitLedgerBalance(net, activeTk, allowNeg) {
      if (allowNeg) {
        const isTwoSided = activeTk.startsWith("131") || activeTk.startsWith("331") || activeTk.startsWith("138") || activeTk.startsWith("338") || activeTk.startsWith("421");

          return { duNo: net, duCo: 0 };
        }
      }
      return { duNo: net > 0 ? net : 0, duCo: net < 0 ? -net : 0 };
    }

    function buildSoCaiContext(C) {
      const nkRows = buildNkRows(C);
      const cat = cdspsCir === "TT99" ? ACCOUNTS_TT99 : ACCOUNTS_TT200;
      const nameMap = new Map(cat);
      const setTks = new Set(cat.map(x => x[0]));
      tkOpening.forEach(o => { if (o.tk) { setTks.add(o.tk.trim()); if (o.ten && !nameMap.has(o.tk)) nameMap.set(o.tk, o.ten); } });
      nkRows.forEach(r => { if (r.no) setTks.add(r.no.trim()); if (r.co) setTks.add(r.co.trim()); });
      const sortedTks = [...setTks].sort((a, b) => a.localeCompare(b, "en"));
      const activeTk = selTk || sortedTks[0] || "156";
      const match = acc => { const c = String(acc || "").trim(); return c && (soCaiSub ? c.startsWith(activeTk) : c === activeTk); };
      const [a, b] = rangeOf(soCaiPer);
      let opNo = 0, opCo = 0, prNo = 0, prCo = 0, ytdNo = 0, ytdCo = 0;
      tkOpening.forEach(o => { if (match(o.tk)) { opNo += Math.round(o.no || 0); opCo += Math.round(o.co || 0); } });
      const sortedYearNk = nkRows
        .filter(r => r.ngay && r.ngay.length >= 7 && +r.ngay.slice(0, 4) === C.Y)
        .sort((x, y) => x.ngay < y.ngay ? -1 : x.ngay > y.ngay ? 1 : String(x.ph || "").localeCompare(String(y.ph || "")));
      const entries = [];
      let totNo = 0, totCo = 0;
      sortedYearNk.forEach((r, idx) => {
        const rm = +r.ngay.slice(5, 7), amt = Math.round(r.s || 0);
        const d = match(r.no), c = match(r.co);
        if (!d && !c) return;
        const psNo = d ? amt : 0, psCo = c ? amt : 0;
        if (rm >= 1 && rm <= b) { ytdNo += psNo; ytdCo += psCo; }
        if (rm >= 1 && rm < a) { prNo += psNo; prCo += psCo; return; }
        if (rm >= a && rm <= b) {
          const doiUng = d && c ? `${r.co}/${r.no}` : d ? r.co : r.no;
          totNo += psNo; totCo += psCo;
          entries.push({
            ngay: r.ngay, ph: r.ph, nd: r.nd,
            trangNkc: Math.floor(idx / 40) + 1, sttNkc: idx + 1,
            doiUng, psNo, psCo
          });
        }
      });
      const netOp = opNo + prNo - (opCo + prCo);
      const openBal = splitLedgerBalance(netOp, activeTk, soCaiAllowNeg);
      const netEnd = netOp + totNo - totCo;
      const endBal = splitLedgerBalance(netEnd, activeTk, soCaiAllowNeg);
      return {
        sortedTks, activeTk, tkName: nameMap.get(activeTk) || "", a, b,
        startNo: openBal.duNo, startCo: openBal.duCo, totNo, totCo, ytdNo, ytdCo,
        endNo: endBal.duNo, endCo: endBal.duCo, entries
      };
    }

    function expSoCai(C) {
      const s = buildSoCaiContext(C);

    }

    function buildS38Context(C) {
      const nkRows = buildNkRows(C);
      const cat = cdspsCir === "TT99" ? ACCOUNTS_TT99 : ACCOUNTS_TT200;
      const nameMap = new Map(cat);
      const setTks = new Set(cat.map(x => x[0]));
      tkOpening.forEach(o => { if (o.tk) { setTks.add(o.tk.trim()); if (o.ten && !nameMap.has(o.tk)) nameMap.set(o.tk, o.ten); } });
      nkRows.forEach(r => { if (r.no) setTks.add(r.no.trim()); if (r.co) setTks.add(r.co.trim()); });
      const sortedTks = [...setTks].sort((a, b) => a.localeCompare(b, "en"));
      const activeTk = selTk || sortedTks[0] || "156";
      const match = acc => { const c = String(acc || "").trim(); return c && (s38Sub ? c.startsWith(activeTk) : c === activeTk); };
      const [a, b] = rangeOf(s38Per);
      let opNo = 0, opCo = 0, prNo = 0, prCo = 0;
      tkOpening.forEach(o => { if (match(o.tk)) { opNo += Math.round(o.no || 0); opCo += Math.round(o.co || 0); } });
      nkRows.forEach(r => {
        if (!r.ngay || r.ngay.length < 7 || +r.ngay.slice(0, 4) !== C.Y) return;
        const rm = +r.ngay.slice(5, 7), amt = Math.round(r.s || 0);
        if (rm >= 1 && rm < a) {
          if (match(r.no)) prNo += amt;
          if (match(r.co)) prCo += amt;
        }
      });
      const netOp = opNo + prNo - (opCo + prCo);
      const openBal = splitLedgerBalance(netOp, activeTk, s38AllowNeg);
      let runNet = netOp, totNo = 0, totCo = 0;
      const entries = [];
      nkRows.forEach(r => {
        if (!r.ngay || r.ngay.length < 7 || +r.ngay.slice(0, 4) !== C.Y) return;
        const rm = +r.ngay.slice(5, 7);
        if (rm < a || rm > b) return;
        const d = match(r.no), c = match(r.co);
        if (!d && !c) return;
        const amt = Math.round(r.s || 0), psNo = d ? amt : 0, psCo = c ? amt : 0;
        const doiUng = d && c ? `${r.co}/${r.no}` : d ? r.co : r.no;
        totNo += psNo; totCo += psCo;
        runNet = runNet + psNo - psCo;
        const bal = splitLedgerBalance(runNet, activeTk, s38AllowNeg);
        entries.push({ ngay: r.ngay, ph: r.ph, nd: r.nd, doiUng, psNo, psCo, duNo: bal.duNo, duCo: bal.duCo, gc: r.gc || "" });
      });
      const endBal = splitLedgerBalance(runNet, activeTk, s38AllowNeg);
      return { sortedTks, activeTk, tkName: nameMap.get(activeTk) || "", a, b, startNo: openBal.duNo, startCo: openBal.duCo, totNo, totCo, endNo: endBal.duNo, endCo: endBal.duCo, entries };
    }

    function expS38(C) {
      const s = buildS38Context(C);

    document.addEventListener("change", e => {

      else if (t.id === "tkNegTop") { tkNegTop = t.checked; tabPage.tk = 1; render(); }
      else if (t.id === "tkVpNegTop") { tkVpNegTop = t.checked; tabPage.tk_vpdd = 1; render(); }

      else if (t.id === "vpPt") { vpddPer.t = t.value; vpddPer.k = 1; tabPage.ct_vpdd = 1; render(); }

      else if (t.id === "vpPy") { vpddPer.y = +t.value; tabPage.ct_vpdd = 1; render(); }

      else if (t.id === "nkPy") { nkPer.y = +t.value; tabPage.nk = 1; render(); }
      else if (t.id === "dmPt") { dmPer.t = t.value; dmPer.k = 1; tabPage.dm = 1; render(); }

      else if (t.id === "cdCir") { cdspsCir = t.value; render(); }
      else if (t.id === "cdPt") { cdspsPer.t = t.value; cdspsPer.k = 1; render(); }
      else if (t.id === "cdPk") { cdspsPer.k = +t.value; render(); }
      else if (t.id === "cdHz") { cdspsHideZero = t.checked; render(); }
      else if (t.id === "cdHnp") { cdspsHideNoPer = t.checked; render(); }

    document.addEventListener("input", e => {
      const t = e.target;
      if (["ctQ", "vpQ", "cdQ", "nkQ", "tkQ", "tkVpQ", "dmQ", "khQ", "nccQ", "cfQ"].includes(t.id)) {
        const v = t.value, tid = t.id;

        if (tid === "ctQ") { ctQ = v; tabPage.ct = 1; }
        else if (tid === "vpQ") { vpddQ = v; tabPage.ct_vpdd = 1; }
        else if (tid === "cdQ") cdQ = v;
        else if (tid === "nkQ") { nkQ = v; tabPage.nk = 1; }
        else if (tid === "tkQ") { tkQ = v; tabPage.tk = 1; }
        else if (tid === "tkVpQ") { tkVpQ = v; tabPage.tk_vpdd = 1; }
        else if (tid === "dmQ") { dmQ = v; tabPage.dm = 1; }
        else if (tid === "khQ") { khQ = v; tabPage.kh = 1; }
        else if (tid === "nccQ") { nccQ = v; tabPage.ncc = 1; }

        if (_qTimer) clearTimeout(_qTimer);
        _qTimer = setTimeout(() => {
          render();
          const q = $("#" + tid);
          if (q) {
            q.focus();
            try { q.setSelectionRange(posStart ?? v.length, posEnd ?? v.length); } catch (_) {}
          }
        }, 120);
      } else if (t.id === "retDirectInp" && directRetEdit) {
        directRetEdit.value = t.value;
        const isVp = t.dataset.vp === "1", arr = isVp ? LnVPDD : Ln;
        const line = arr.find(x => x.id === t.dataset.retDirectId);
        if (line) {
          const raw = t.value.trim();
          const num = raw === "" ? null : Math.round(Number(raw));
          const validNum = (num !== null && !isNaN(num)) ? num : null;
          t.classList.toggle("need", validNum == null);
          t.classList.toggle("ok", validNum != null);
          const tr = t.closest("tr");
          if (tr) {
            const gxCell = tr.querySelector(".ret-gx-cell");
            if (gxCell) gxCell.textContent = validNum != null ? fmt(Math.round((line.sx || 0) * validNum)) : "";
          }
        }
        pendingRetRecalc = true;
      } else if (t.dataset.ed && editLine) {
        const k = t.dataset.ed;
        if (k === "sn" || k === "sx") editLine.draft[k] = t.value === "" ? null : Number(t.value);
        else if (k === "gn" || k === "gi") editLine.draft[k] = t.value === "" ? null : Math.round(Number(t.value));
        else editLine.draft[k] = t.value;
      } else if (t.dataset.edm && editDm) {
        const k = t.dataset.edm;
        if (k === "sl") editDm.draft.sl = Number(t.value) || 0;
        else if (k === "gt") editDm.draft.gt = Math.round(Number(t.value) || 0);
        else editDm.draft[k] = t.value;
      } else if (t.dataset.etk && editTk) {
        const k = t.dataset.etk;
        if (k === "sl") editTk.sl = Number(t.value) || 0;
        else if (k === "gt") editTk.gt = Math.round(Number(t.value) || 0);
        else editTk[k] = t.value;
      } else if (t.dataset.enk && editNk) {
        const k = t.dataset.enk;
        if (k === "tien") editNk.draft.tien = Math.round(Number(t.value) || 0);
        else editNk.draft[k] = t.value;
      } else if (t.dataset.ecd && editCdsps) {
        const k = t.dataset.ecd;
        if (k === "no" || k === "co") editCdsps[k] = Math.round(Number(t.value) || 0);
        else editCdsps[k] = t.value;
      } else if (t.dataset.ept && editPartner) {
        const k = t.dataset.ept;
        if (k === "dauNo" || k === "dauCo") editPartner.draft[k] = Math.round(Number(t.value) || 0);
        else editPartner.draft[k] = t.value;
      } else if (t.dataset.c) {
        CFG[t.dataset.c] = t.value; scheduleSaveLocal();
      }
    });
    document.addEventListener("keydown", e => {
      const t = e.target;
      if (t.id === "retDirectInp") {
        if (e.key === "Enter") {
          e.preventDefault();
          if (_retBlurTimer) { clearTimeout(_retBlurTimer); _retBlurTimer = null; }
          _skipDirectBlur = true;
          directRetEdit && (directRetEdit.value = t.value);
          commitDirectRetEdit(true);
        } else if (e.key === "Escape") {
          e.preventDefault();
          if (_retBlurTimer) { clearTimeout(_retBlurTimer); _retBlurTimer = null; }
          _skipDirectBlur = true;
          directRetEdit = null;
          pendingRetRecalc = false;
          render();
        }
        return;
      }
      if (t.id === "nkNoteDirectInp") {
        if (e.key === "Enter") {
          e.preventDefault();
          if (_nkNoteBlurTimer) { clearTimeout(_nkNoteBlurTimer); _nkNoteBlurTimer = null; }
          _skipDirectBlur = true;
          commitDirectNkNote(t.dataset.nkkey, t.dataset.nksrc, +t.dataset.nkidx, t.value);
        } else if (e.key === "Escape") {
          e.preventDefault();
          if (_nkNoteBlurTimer) { clearTimeout(_nkNoteBlurTimer); _nkNoteBlurTimer = null; }
          _skipDirectBlur = true;
          directNkNoteKey = "";
          render();
        }
        return;
      }
      const edRow = t.closest && t.closest("tr.ed-row");
      if (edRow) {
        const kind = edRow.dataset.edkind;
        if (e.key === "Enter" && !t.closest("button")) {
          e.preventDefault();
          if (kind === "ct") saveEditLine();
          else if (kind === "dm") saveDm();
          else if (kind === "tk") saveTk();
          else if (kind === "nk") saveNk();
          else if (kind === "cdsps") saveCdspsOpening();
          else if (kind === "pt") savePartner();
        } else if (e.key === "Escape") {
          e.preventDefault();
          if (kind === "ct") editLine = null;
          else if (kind === "dm") editDm = null;
          else if (kind === "tk") editTk = null;
          else if (kind === "nk") editNk = null;
          else if (kind === "cdsps") editCdsps = null;
          else if (kind === "pt") editPartner = null;
          render();
        }
      }
    });
    document.addEventListener("focusout", e => {
      const t = e.target;
      if (t.id === "retDirectInp") {
        if (_skipDirectBlur) { _skipDirectBlur = false; return; }
        const val = t.value;
        if (_retBlurTimer) clearTimeout(_retBlurTimer);
        _retBlurTimer = setTimeout(() => {
          _retBlurTimer = null;
          if (directRetEdit && (!document.activeElement || document.activeElement.id !== "retDirectInp")) {
            directRetEdit.value = val;
            commitDirectRetEdit(false);
          }
        }, 90);
      } else if (t.id === "nkNoteDirectInp") {
        if (_skipDirectBlur) { _skipDirectBlur = false; return; }
        const key = t.dataset.nkkey, src = t.dataset.nksrc, idx = +t.dataset.nkidx, val = t.value;
        if (_nkNoteBlurTimer) clearTimeout(_nkNoteBlurTimer);
        _nkNoteBlurTimer = setTimeout(() => {
          _nkNoteBlurTimer = null;
          if (directNkNoteKey === key && (!document.activeElement || document.activeElement.id !== "nkNoteDirectInp")) {
            commitDirectNkNote(key, src, idx, val);
          }
        }, 90);
      }
    });

    $("#ball").onclick = expAll;
    $("#bexp").onclick = () => {
      const b = new Blob([JSON.stringify({ yr: +$("#yr").value, up: +$("#up").value, P, Ln, LnVPDD, vpddOpening, tkOpening, nkNotes, NKX, KH, NCC, CFG }, null, 2)], { type: "application/json" });

    $("#fimp").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;

        const d = JSON.parse(await f.text());
        P.length = 0; Ln.length = 0; LnVPDD.length = 0; tkOpening.length = 0; NKX.length = 0; KH.length = 0; NCC.length = 0;
        for (const k in vpddOpening) delete vpddOpening[k];

        ensureIds(Ln); ensureIds(LnVPDD);

        tkOpening.push(...(d.tkOpening || []));
        Object.assign(nkNotes, d.nkNotes || {});
        NKX.push(...(d.NKX || [])); KH.push(...(d.KH || [])); NCC.push(...(d.NCC || [])); Object.assign(CFG, d.CFG || {});
        markDirty("all");
        saveLocal(); st("Đã khôi phục dữ liệu từ file JSON."); render();

    };
    $("#bclear").onclick = () => {

      $("#m-clr").onclick = () => {
        P.length = 0; Ln.length = 0; LnVPDD.length = 0; tkOpening.length = 0; NKX.length = 0; KH.length = 0; NCC.length = 0;
        for (const k in vpddOpening) delete vpddOpening[k];
        for (const k in nkNotes) delete nkNotes[k];
        scMa = ""; scVpddMa = ""; selCtId = ""; selVpddId = ""; selDmMa = ""; selNkKey = ""; selKhMa = ""; selNccMa = "";
        directRetEdit = null; directNkNoteKey = "";
        editLine = null; editDm = null; editTk = null; editNk = null; editCdsps = null; editPartner = null;
        pendingRetRecalc = false;

    $("#bsample").onclick = () => {

      Ln.push(
        { id: uid(), ph: "NK-0101", ngay: "2026-01-05", hd: "0001234", kh: "NCC01", no: "156", co: "331", nd: "Nhập hàng từ Cty Hoàng Long", ma: "VPP001", sn: 100, gn: 70000, sx: null, gi: null },

        { tk: "411", ten: "Vốn đầu tư của chủ sở hữu", no: 0, co: 209800000 }

      KH.push({ ma: "KH01", ten: "Công ty ABC", mst: "0301234567", dauNo: 5000000, dauCo: 0, dau: 5000000 });
      NCC.push({ ma: "NCC01", ten: "Công ty Hoàng Long", mst: "0101234567", dauNo: 0, dauCo: 12000000, dau: 12000000 });
      Object.assign(CFG, { ten: "CÔNG TY TNHH MINH ANH", dc: "128 Nguyễn Thị Minh Khai, Q3, TP.HCM", mst: "0314567890" });

    };
